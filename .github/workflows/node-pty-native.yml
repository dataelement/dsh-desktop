name: Native node-pty helper

on:
  pull_request:
    branches: [V0.12.2]
    paths:
      - ".github/workflows/node-pty-native.yml"
      - "patches/node-pty+*.patch"
      - "test/node-pty-*.test.*"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-pty:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run real native PTY layout matrix and helper resolution regressions
        run: npx --no-install vitest run --maxWorkers=1 test/node-pty-asar-layout.test.ts test/node-pty-helper-path.test.ts test/node-pty-cleanup.test.mjs --reporter=verbose
      - run: npm run typecheck
