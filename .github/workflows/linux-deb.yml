name: Build unofficial Linux DEB

on:
  push:
    branches: [main]
    paths: [.github/workflows/linux-deb.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (leave empty for latest stable release)"
        required: false
        type: string
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: linux-deb-release
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find upstream release to build
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/dataelement/dsh-desktop.git 2>/dev/null || \
            git remote set-url upstream https://github.com/dataelement/dsh-desktop.git
          git fetch --force --tags upstream

          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh api repos/dataelement/dsh-desktop/releases/latest --jq '.tag_name')"
          fi
          test -n "$tag"
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          source_sha="$(git rev-list -n 1 "$tag")"

          version="${tag#v}"
          release_tag="linux-$tag"
          asset="dsh-desktop-${version}-linux-amd64.deb"
          should_build=true
          if [ "$EVENT_NAME" != "push" ] && \
            gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[].name" 2>/dev/null | grep -Fxq "$asset"; then
            should_build=false
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out exact upstream source
        env:
          UPSTREAM_TAG: ${{ needs.discover.outputs.tag }}
          SOURCE_SHA: ${{ needs.discover.outputs.source_sha }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/dataelement/dsh-desktop.git 2>/dev/null || \
            git remote set-url upstream https://github.com/dataelement/dsh-desktop.git
          git fetch --force upstream "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          git checkout --detach "$UPSTREAM_TAG"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add Linux packaging metadata
        env:
          UPSTREAM_TAG: ${{ needs.discover.outputs.tag }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const version = process.env.UPSTREAM_TAG?.replace(/^v/, '')
          if (!version || !/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Cannot derive a valid package version from tag: ${process.env.UPSTREAM_TAG}`)
          }
          pkg.version = version
          pkg.build ??= {}
          pkg.build.linux = {
            target: [{ target: 'deb', arch: ['x64'] }],
            category: 'Development',
            icon: 'build/linux-icons',
            maintainer: 'ethanrise <ethanrise.ai@gmail.com>',
            artifactName: 'dsh-desktop-linux-${arch}.${ext}',
            desktop: {
              entry: {
                StartupWMClass: 'dsh-desktop'
              }
            }
          }
          pkg.build.extraResources ??= []
          pkg.build.extraResources.push({ from: 'LICENSE', to: 'LICENSE' })
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Generate Linux icon sizes
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const sharp = require('sharp')
          const sizes = [16, 24, 32, 48, 64, 128, 256, 512, 1024]
          const output = path.join('build', 'linux-icons')
          fs.mkdirSync(output, { recursive: true })
          Promise.all(sizes.map((size) =>
            sharp('build/app-icon.png')
              .resize(size, size)
              .png()
              .toFile(path.join(output, `${size}x${size}.png`))
          )).catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

      - name: Build application and DEB
        env:
          UPSTREAM_TAG: ${{ needs.discover.outputs.tag }}
        run: |
          npm run build
          npx electron-builder --linux deb --x64 --publish never
          test -f dist/dsh-desktop-linux-amd64.deb
          mv dist/dsh-desktop-linux-amd64.deb \
            "dist/dsh-desktop-${UPSTREAM_TAG#v}-linux-amd64.deb"

      - name: Verify DEB contents and metadata
        env:
          UPSTREAM_TAG: ${{ needs.discover.outputs.tag }}
        run: |
          set -euo pipefail
          version="${UPSTREAM_TAG#v}"
          asset="dist/dsh-desktop-${version}-linux-amd64.deb"
          dpkg-deb --info "$asset" >/dev/null
          dpkg-deb --contents "$asset" >/dev/null
          test "$(dpkg-deb -f "$asset" Package)" = "dsh-desktop"
          test "$(dpkg-deb -f "$asset" Version)" = "$version"
          test "$(dpkg-deb -f "$asset" Architecture)" = "amd64"
          test -n "$(dpkg-deb -f "$asset" Depends)"

          verify_root="$RUNNER_TEMP/dsh-deb-verify"
          mkdir -p "$verify_root"
          dpkg-deb -x "$asset" "$verify_root"
          test -x "$verify_root/opt/DSH Desktop/dsh-desktop"
          app_resources="$verify_root/opt/DSH Desktop/resources"
          if [ -f "$app_resources/app.asar" ]; then
            APP_RESOURCES="$app_resources" EXPECTED_VERSION="$version" node <<'NODE'
          const path = require('node:path')
          const fs = require('node:fs')
          const asar = require('@electron/asar')
          const archive = path.join(process.env.APP_RESOURCES, 'app.asar')
          const entries = new Set(asar.listPackage(archive).map((entry) => entry.replace(/^\//, '')))
          for (const entry of ['package.json', 'out/main/index.js', 'out/preload/index.cjs']) {
            if (!entries.has(entry)) throw new Error(`Missing from app.asar: ${entry}`)
          }
          const pkg = JSON.parse(asar.extractFile(archive, 'package.json').toString())
          if (pkg.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`Packaged version ${pkg.version} != ${process.env.EXPECTED_VERSION}`)
          }
          const node = path.join(process.env.APP_RESOURCES, 'app.asar.unpacked/node_modules/node/bin/node')
          fs.accessSync(node, fs.constants.X_OK)
          NODE
          else
            test -f "$app_resources/app/package.json"
            test -f "$app_resources/app/out/main/index.js"
            test -f "$app_resources/app/out/preload/index.cjs"
            test -x "$app_resources/app/node_modules/node/bin/node"
            test "$(node -p 'require(process.argv[1]).version' \
              "$app_resources/app/package.json")" = "$version"
          fi
          test -f "$verify_root/opt/DSH Desktop/resources/icon.png"
          test -f "$verify_root/usr/share/applications/dsh-desktop.desktop"
          grep -Fxq 'Icon=dsh-desktop' \
            "$verify_root/usr/share/applications/dsh-desktop.desktop"
          grep -Fxq 'StartupWMClass=dsh-desktop' \
            "$verify_root/usr/share/applications/dsh-desktop.desktop"
          test -f "$verify_root/opt/DSH Desktop/resources/LICENSE"
          for size in 16 24 32 48 64 128 256 512 1024; do
            test -f "$verify_root/usr/share/icons/hicolor/${size}x${size}/apps/dsh-desktop.png"
          done

          (cd dist && sha256sum "$(basename "$asset")" > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux-amd64-${{ needs.discover.outputs.tag }}
          path: |
            dist/dsh-desktop-*-linux-amd64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Publish unofficial Linux release asset
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.discover.outputs.tag }}
          RELEASE_TAG: ${{ needs.discover.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.discover.outputs.source_sha }}
        run: |
          set -euo pipefail
          asset="dist/dsh-desktop-${UPSTREAM_TAG#v}-linux-amd64.deb"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Unofficial Linux build

          Community-maintained Linux amd64 package built from
          [dataelement/dsh-desktop@$UPSTREAM_TAG](https://github.com/dataelement/dsh-desktop/tree/$UPSTREAM_TAG).

          - Upstream tag: \`$UPSTREAM_TAG\`
          - Source commit: \`$SOURCE_SHA\`
          - Architecture: \`amd64\`
          - Package format: \`.deb\`

          Install:

          \`\`\`bash
          sudo apt install ./$(basename "$asset")
          \`\`\`

          Verify the download with the attached \`SHA256SUMS\` file.

          This is an unofficial community build and is not an official DataElement release.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$asset" dist/SHA256SUMS \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --title "DSH Desktop $UPSTREAM_TAG - Unofficial Linux build" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$asset" dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title "DSH Desktop $UPSTREAM_TAG - Unofficial Linux build" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          # Remove a legacy release only when its same-name tag points at the
          # wrong commit. Correct upstream tags are preserved.
          legacy_commit="$(git ls-remote origin "refs/tags/$UPSTREAM_TAG^{}" | awk '{print $1}')"
          if [ -z "$legacy_commit" ]; then
            legacy_commit="$(git ls-remote origin "refs/tags/$UPSTREAM_TAG" | awk '{print $1}')"
          fi
          if [ -n "$legacy_commit" ] && [ "$legacy_commit" != "$SOURCE_SHA" ]; then
            gh release delete "$UPSTREAM_TAG" --cleanup-tag --yes \
              --repo "$GITHUB_REPOSITORY" || \
              echo "::warning::Could not remove legacy release/tag $UPSTREAM_TAG"
          fi
          gh release delete-asset "$UPSTREAM_TAG" dsh-desktop-linux-amd64.deb \
            --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
