name: Build unofficial Linux DEB

# Builds Linux amd64 .deb packages straight from upstream release tags
# (dataelement/dsh-desktop vX.Y.Z) and publishes them here as linux-vX.Y.Z.
# The fork's own branches never carry upstream source, so there is nothing
# to sync or merge.

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build, e.g. v0.9.3 (empty = every recent release still missing a Linux build)"
        required: false
        type: string
      force:
        description: "Rebuild even if the Linux asset already exists"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [.github/workflows/linux-deb.yml]

permissions:
  contents: read

concurrency:
  group: linux-deb-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: dataelement/dsh-desktop
  # How many of the newest upstream releases to check on each scheduled run.
  RECENT_RELEASES: "5"

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - name: Find upstream releases missing a Linux build
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if [ -n "$REQUESTED_TAG" ]; then
            candidates="$REQUESTED_TAG"
          else
            candidates="$(gh api "repos/$UPSTREAM_REPO/releases?per_page=30" \
              --jq '[.[] | select(.draft | not) | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+"))][:'"$RECENT_RELEASES"'][] | .tag_name')"
          fi

          tags=()
          for tag in $candidates; do
            sha="$(gh api "repos/$UPSTREAM_REPO/commits/$tag" --jq .sha)" || {
              echo "::warning::Upstream tag $tag not found, skipping"; continue; }
            asset="dsh-desktop-${tag#v}-linux-amd64.deb"
            if [ "$FORCE" != "true" ] && \
              gh release view "linux-$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq '.assets[].name' 2>/dev/null | grep -Fxq "$asset"; then
              echo "linux-$tag already has $asset"
              continue
            fi
            echo "Will build $tag ($sha)"
            tags+=("{\"tag\":\"$tag\",\"sha\":\"$sha\"}")
          done

          # Build oldest first so the newest release ends up marked "latest".
          json="[]"
          if [ ${#tags[@]} -gt 0 ]; then
            json="$(printf '%s\n' "${tags[@]}" | jq -s -c 'reverse')"
          fi
          echo "matrix={\"include\":$json}" >> "$GITHUB_OUTPUT"
          echo "count=${#tags[@]}" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      UPSTREAM_TAG: ${{ matrix.tag }}
      SOURCE_SHA: ${{ matrix.sha }}
    steps:
      - name: Check out upstream source at ${{ matrix.tag }}
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add Linux packaging metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const version = process.env.UPSTREAM_TAG.replace(/^v/, '')
          if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Cannot derive a valid package version from tag: ${process.env.UPSTREAM_TAG}`)
          }
          pkg.version = version
          pkg.build ??= {}
          pkg.build.linux = {
            target: [{ target: 'deb', arch: ['x64'] }],
            category: 'Development',
            icon: 'build/linux-icons',
            maintainer: 'ethanrise <ethanrise.ai@gmail.com>',
            artifactName: 'dsh-desktop-linux-${arch}.${ext}',
            desktop: { entry: { StartupWMClass: 'dsh-desktop' } }
          }
          pkg.build.extraResources ??= []
          pkg.build.extraResources.push({ from: 'LICENSE', to: 'LICENSE' })
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Generate Linux icon sizes
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const sharp = require('sharp')
          const out = path.join('build', 'linux-icons')
          fs.mkdirSync(out, { recursive: true })
          Promise.all([16, 24, 32, 48, 64, 128, 256, 512, 1024].map((s) =>
            sharp('build/app-icon.png').resize(s, s).png().toFile(path.join(out, `${s}x${s}.png`))
          )).catch((e) => { console.error(e); process.exit(1) })
          NODE

      - name: Build application and DEB
        run: |
          set -euo pipefail
          npm run build
          npx electron-builder --linux deb --x64 --publish never
          mv dist/dsh-desktop-linux-amd64.deb "dist/dsh-desktop-${UPSTREAM_TAG#v}-linux-amd64.deb"

      - name: Verify DEB
        run: |
          set -euo pipefail
          version="${UPSTREAM_TAG#v}"
          asset="dist/dsh-desktop-${version}-linux-amd64.deb"
          root="$RUNNER_TEMP/deb-root"
          fail() { echo "::error::$1"; exit 1; }
          warn() { echo "::warning::$1"; }

          # --- Hard checks: the package is installable and launchable. ---
          dpkg-deb --info "$asset"
          [ "$(dpkg-deb -f "$asset" Package)" = "dsh-desktop" ] || fail "Package name"
          [ "$(dpkg-deb -f "$asset" Version)" = "$version" ] || fail "Version != $version"
          [ "$(dpkg-deb -f "$asset" Architecture)" = "amd64" ] || fail "Architecture"
          dpkg-deb -x "$asset" "$root"

          # Print the layout up front so any failure below is easy to diagnose.
          echo "::group::Package layout"
          (cd "$root" && find . -maxdepth 4 -not -path '*/node_modules/*' | sort)
          echo "::endgroup::"

          app_dir="$(dirname "$(find "$root/opt" -maxdepth 2 -type f -name dsh-desktop -perm -u+x | head -1)")"
          [ -n "$app_dir" ] && [ "$app_dir" != "." ] || fail "No executable dsh-desktop under /opt"
          desktop="$root/usr/share/applications/dsh-desktop.desktop"
          [ -f "$desktop" ] || fail "Missing $desktop"
          [ -f "$root/usr/share/icons/hicolor/256x256/apps/dsh-desktop.png" ] || fail "Missing 256px icon"

          # --- Soft checks: upstream packaging details that may change. ---
          grep -Fxq 'StartupWMClass=dsh-desktop' "$desktop" || warn "StartupWMClass not set"
          for s in 16 24 32 48 64 128 512 1024; do
            [ -f "$root/usr/share/icons/hicolor/${s}x${s}/apps/dsh-desktop.png" ] || warn "Missing ${s}px icon"
          done
          [ -f "$app_dir/resources/LICENSE" ] || warn "LICENSE not bundled"
          if [ -f "$app_dir/resources/app.asar" ]; then
            APP_RESOURCES="$app_dir/resources" EXPECTED_VERSION="$version" node <<'NODE' || warn "app.asar contents differ from expectations (see log above)"
          const path = require('node:path')
          const asar = require('@electron/asar')
          const archive = path.join(process.env.APP_RESOURCES, 'app.asar')
          const pkg = JSON.parse(asar.extractFile(archive, 'package.json').toString())
          if (pkg.version !== process.env.EXPECTED_VERSION) throw new Error(`asar version ${pkg.version}`)
          const entries = new Set(asar.listPackage(archive).map((e) => e.replace(/^\//, '')))
          const missing = ['out/main/index.js'].filter((e) => !entries.has(e))
          if (missing.length) throw new Error(`Missing from app.asar: ${missing.join(', ')}`)
          NODE
          fi

          (cd dist && sha256sum "$(basename "$asset")" > SHA256SUMS)

      - uses: actions/upload-artifact@v5
        with:
          name: dsh-desktop-linux-amd64-${{ matrix.tag }}
          path: |
            dist/dsh-desktop-*-linux-amd64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Publish linux-${{ matrix.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="linux-$UPSTREAM_TAG"
          asset="dist/dsh-desktop-${UPSTREAM_TAG#v}-linux-amd64.deb"
          title="DSH Desktop $UPSTREAM_TAG - Unofficial Linux build"
          prerelease=""
          case "$UPSTREAM_TAG" in *-*) prerelease="--prerelease" ;; esac

          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Unofficial Linux build

          Community-maintained Linux amd64 package built from
          [$UPSTREAM_REPO@$UPSTREAM_TAG](https://github.com/$UPSTREAM_REPO/tree/$UPSTREAM_TAG).

          - Upstream tag: \`$UPSTREAM_TAG\`
          - Source commit: \`$SOURCE_SHA\`
          - Architecture: \`amd64\`

          Install:

          \`\`\`bash
          sudo apt install ./$(basename "$asset")
          \`\`\`

          Verify the download with the attached \`SHA256SUMS\`.
          This is not an official DataElement release.
          EOF

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$asset" dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$release_tag" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag" "$asset" dist/SHA256SUMS $prerelease \
              --target "$GITHUB_SHA" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" \
              --repo "$GITHUB_REPOSITORY"
          fi

  # GitHub disables scheduled workflows after 60 days without repository
  # activity. Now that nothing commits here automatically, re-enable monthly.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" -lt 3 ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/linux-deb.yml/enable"
          fi
