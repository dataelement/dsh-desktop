name: Release desktop installers

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - V0.9.1
  workflow_dispatch:
    inputs:
      mode:
        description: 操作（development 开发包 / signed 测试包 / prerelease 预发布 / publish 继续正式发布 / resign 重签）
        required: true
        default: development
        type: choice
        options:
          - development
          - signed
          - prerelease
          - publish
          - resign
      target:
        description: 平台（继续正式发布选 all，重签选 windows）
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
      version:
        description: 版本（开发包留空；测试包如 0.13.0-test.4；继续正式发布如 v0.13.0）
        required: false
        type: string
      source_run_id:
        description: 来源任务 ID（仅继续正式发布或重签需要）
        required: false
        type: string
      checks:
        description: 验证级别（standard 常规 / extended 增加 Windows 全量测试、恢复界面、启动与归档检查）
        required: true
        default: standard
        type: choice
        options:
          - standard
          - extended

permissions:
  contents: write

env:
  RELEASE_NOTES_MODEL: gpt-6-luna

concurrency:
  # Platform-only retries have independent artifacts and never publish.
  group: desktop-release-${{ github.ref }}-${{ inputs.target || 'all' }}
  cancel-in-progress: false

jobs:
  validate-dispatch:
    name: Validate dispatch inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Validate workflow_dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          CHECKS: ${{ inputs.checks }}
        run: |
          set -euo pipefail
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'
          if ! [[ "$TARGET" =~ ^(all|windows|macos)$ ]] || ! [[ "$CHECKS" =~ ^(standard|extended)$ ]]; then
            echo "::error::Choose a valid platform and validation level"
            exit 1
          fi
          case "$MODE" in
            publish)
              if [ "$TARGET" != 'all' ] || ! [[ "$VERSION" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::publish requires target=all, version=vX.Y.Z and a positive source_run_id"
                exit 1
              fi
              ;;
            signed|prerelease|resign)
              if ! [[ "$VERSION" =~ $semver_re ]]; then
                echo "::error::$MODE requires a non-v semver version (e.g. 0.13.0-test.4)"
                exit 1
              fi
              if [ "$MODE" = 'resign' ]; then
                if [ "$TARGET" != 'windows' ] || ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
                  echo "::error::resign requires target=windows and a positive source_run_id"
                  exit 1
                fi
              elif [ -n "$SOURCE_RUN_ID" ]; then
                echo "::error::source_run_id is only used by publish or resign"
                exit 1
              fi
              if [ "$MODE" = 'prerelease' ] && [ "$TARGET" != 'all' ]; then
                echo "::notice::target=$TARGET with prerelease mode will sign only and skip GitHub/ModelScope publish"
              fi
              ;;
            development)
              if [ -n "$VERSION$SOURCE_RUN_ID" ]; then
                echo "::error::development uses the checked-out version; leave version and source_run_id empty"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown mode: $MODE"
              exit 1
              ;;
          esac
      - name: Skip validation for tag and pull_request
        if: github.event_name != 'workflow_dispatch'
        run: echo "No dispatch inputs to validate."
      - name: Validate signed test upload and notification secrets
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'signed'
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          FEISHU_RELEASE_WEBHOOK: ${{ secrets.FEISHU_RELEASE_WEBHOOK }}
        run: |
          test -n "$MODELSCOPE_TOKEN" || { echo "::error::Missing secret MODELSCOPE_TOKEN"; exit 1; }
          test -n "$FEISHU_RELEASE_WEBHOOK" || { echo "::error::Missing secret FEISHU_RELEASE_WEBHOOK"; exit 1; }

  macos:
    name: macOS ${{ matrix.label }}
    needs: validate-dispatch
    if: >-
      inputs.mode != 'publish' && (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'macos')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: Apple Silicon
            runner: macos-15
            app-directory: mac-arm64
            artifact: macos-apple-silicon
          - arch: x64
            label: Intel
            runner: macos-15-intel
            app-directory: mac
            artifact: macos-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${{ github.ref_name }}"
      - name: Set app version from pre-release tag
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prerelease' && inputs.version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.version }}"
      - name: Set app version from signed version
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'signed' && inputs.version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.version }}"
      - name: Configure native download caches before dependency installation
        shell: bash
        run: |
          # Electron 43 install.js reads the lowercase setting; builder uses uppercase.
          echo "electron_config_cache=$RUNNER_TEMP/electron-cache" >> "$GITHUB_ENV"
          echo "ELECTRON_CACHE=$RUNNER_TEMP/electron-cache" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder-cache" >> "$GITHUB_ENV"
      - name: Cache Electron downloads before dependency installation
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies with timings
        run: npm ci --prefer-offline --no-audit --no-fund --timing --logs-dir "${{ runner.temp }}/npm-timings"
      - name: Upload dependency installation timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-timings-${{ github.job }}-${{ runner.arch }}
          path: ${{ runner.temp }}/npm-timings/*-timing.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Cache Office runtime downloads
        uses: actions/cache@v4
        with:
          path: |
            .build/office-downloads
          key: office-runtime-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('scripts/office-runtime/**', 'packages/office-runtime/**', 'package-lock.json') }}
          restore-keys: |
            office-runtime-${{ runner.os }}-${{ matrix.arch }}-
      - name: Cache generated Office and PPT assets
        uses: actions/cache@v4
        with:
          enableCrossOsArchive: true
          path: |
            .build/office-template-cache
            .build/ppt-runtime
          key: desktop-generated-assets-v1-${{ hashFiles('scripts/office-runtime/**', 'packages/dsh-desktop-office/**', 'scripts/*ppt*.mjs', 'scripts/ppt/**', 'packages/ppt-runtime/**', 'package-lock.json') }}
          restore-keys: desktop-generated-assets-v1-
      - run: npm run build
      - name: Typecheck shared code on macOS
        if: matrix.arch == 'arm64'
        run: npm run typecheck
      - name: Run shared tests on macOS
        if: matrix.arch == 'arm64'
        run: npx --no-install vitest run --exclude '**/test/docx-template-fidelity*' --exclude '**/test/ppt-personal-templates*' --exclude '**/test/ppt-import-memory*' --exclude '**/test/ppt-personal-template-ui*' --exclude '**/test/ppt-windows-font-layout*'
      - name: Verify PPT generation leaves tracked sources clean
        run: git diff --exit-code -- packages/ppt-runtime scripts/ppt
      - name: Validate Apple release secrets
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          required=(CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID)
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
      - name: Prepare Apple notarization key
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Prepare macOS signing keychain
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        id: signing_keychain
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
        run: node scripts/prepare-macos-signing-keychain.mjs
      - name: Build signed ${{ matrix.label }} package
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
        run: node scripts/verify-target.mjs darwin ${{ matrix.arch }} && npx --no-install electron-builder --mac --${{ matrix.arch }} --publish never
      - name: Build isolated ${{ matrix.label }} development package
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.mode == 'development') }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/verify-target.mjs darwin ${{ matrix.arch }} && npx --no-install electron-builder --mac --${{ matrix.arch }} --publish never --config electron-builder.dev.cjs
      - name: Preserve ${{ matrix.label }} update metadata
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        run: mv dist/latest-mac.yml dist/latest-mac-${{ matrix.arch }}.yml
      - name: Sign, notarize, and staple ${{ matrix.label }} DMG
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
        run: |
          dmg_path="dist/dsh-desktop-mac-${{ matrix.arch }}.dmg"
          identity="$(security find-identity -v -p codesigning "$CSC_KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity" || { echo "::error::Developer ID Application identity not found"; exit 1; }
          codesign --keychain "$CSC_KEYCHAIN" --sign "$identity" --timestamp --force "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple "$dmg_path"; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            echo "stapler staple failed, waiting for Apple ticket propagation in $((attempt * 15))s (attempt $attempt/6)..."
            sleep $((attempt * 15))
          done
      - name: Remove temporary signing keychain
        if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease')))
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          SIGNING_CERTIFICATE: ${{ steps.signing_keychain.outputs.certificate }}
          SIGNING_KEYCHAIN_LIST: ${{ steps.signing_keychain.outputs.keychain_list }}
        run: |
          if [ -n "$SIGNING_KEYCHAIN_LIST" ] && [ -f "$SIGNING_KEYCHAIN_LIST" ]; then
            keychains=()
            while IFS= read -r keychain; do
              test -z "$keychain" || keychains+=("$keychain")
            done < "$SIGNING_KEYCHAIN_LIST"
            security list-keychains -d user -s "${keychains[@]}"
            rm -f "$SIGNING_KEYCHAIN_LIST"
          fi
          test -z "$SIGNING_KEYCHAIN" || security delete-keychain "$SIGNING_KEYCHAIN" || rm -f "$SIGNING_KEYCHAIN"
          test -z "$SIGNING_CERTIFICATE" || rm -f "$SIGNING_CERTIFICATE"
          test -z "$APPLE_API_KEY" || rm -f "$APPLE_API_KEY"
      - name: Verify signed and notarized ${{ matrix.label }} app
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        run: |
          app_path="dist/${{ matrix.app-directory }}/DSH Desktop.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler validate "$app_path"; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            echo "stapler validate failed on app_path, retrying in $((attempt * 10))s (attempt $attempt/6)..."
            sleep $((attempt * 10))
          done
          codesign --verify --verbose=2 dist/dsh-desktop-mac-${{ matrix.arch }}.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 dist/dsh-desktop-mac-${{ matrix.arch }}.dmg
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler validate dist/dsh-desktop-mac-${{ matrix.arch }}.dmg; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            echo "stapler validate failed on dmg, retrying in $((attempt * 10))s (attempt $attempt/6)..."
            sleep $((attempt * 10))
          done
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        with:
          name: ${{ matrix.artifact }}
          retention-days: 7
          path: |
            dist/dsh-desktop-mac-${{ matrix.arch }}.dmg
            dist/dsh-desktop-mac-${{ matrix.arch }}.zip
            dist/dsh-desktop-mac-${{ matrix.arch }}.zip.blockmap
            dist/latest-mac-${{ matrix.arch }}.yml
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.mode == 'development') }}
        with:
          name: ${{ matrix.artifact }}-dev
          retention-days: 3
          path: |
            dist-dev/dsh-desktop-dev-mac-${{ matrix.arch }}.dmg
            dist-dev/dsh-desktop-dev-mac-${{ matrix.arch }}.zip
            dist-dev/dsh-desktop-dev-mac-${{ matrix.arch }}.zip.blockmap
          compression-level: 0
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    needs: validate-dispatch
    if: >-
      inputs.mode != 'publish' && (startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.mode != 'resign' &&
        (inputs.target == 'all' || inputs.target == 'windows')))
    runs-on: windows-2022
    steps:
      - name: Preserve shared asset fingerprints during checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${{ github.ref_name }}"
      - name: Set app version from pre-release tag
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prerelease' && inputs.version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.version }}"
      - name: Set app version from signed version
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'signed' && inputs.version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.version }}"
      - name: Configure native download caches before dependency installation
        shell: bash
        run: |
          # Electron 43 install.js reads the lowercase setting; builder uses uppercase.
          echo "electron_config_cache=$RUNNER_TEMP/electron-cache" >> "$GITHUB_ENV"
          echo "ELECTRON_CACHE=$RUNNER_TEMP/electron-cache" >> "$GITHUB_ENV"
          echo "ELECTRON_BUILDER_CACHE=$RUNNER_TEMP/electron-builder-cache" >> "$GITHUB_ENV"
      - name: Cache Office runtime downloads and packaging tools
        uses: actions/cache@v4
        with:
          path: |
            .build/office-downloads
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: windows-packaging-v1-${{ hashFiles('scripts/office-runtime/**', 'packages/office-runtime/**', 'package-lock.json') }}
          restore-keys: |
            windows-packaging-v1-
      - name: Install dependencies with timings
        run: npm ci --prefer-offline --no-audit --no-fund --timing --logs-dir "${{ runner.temp }}/npm-timings"
      - name: Upload dependency installation timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-timings-${{ github.job }}-${{ runner.arch }}
          path: ${{ runner.temp }}/npm-timings/*-timing.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Cache generated Office and PPT assets
        uses: actions/cache@v4
        with:
          enableCrossOsArchive: true
          path: |
            .build/office-template-cache
            .build/ppt-runtime
          key: desktop-generated-assets-v1-${{ hashFiles('scripts/office-runtime/**', 'packages/dsh-desktop-office/**', 'scripts/*ppt*.mjs', 'scripts/ppt/**', 'packages/ppt-runtime/**', 'package-lock.json') }}
          restore-keys: desktop-generated-assets-v1-
      - run: npm run build
      - name: Typecheck shared code on Windows
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target == 'windows')
        run: npm run typecheck
      - name: Run focused Windows regressions
        if: inputs.checks != 'extended' && github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.target == 'windows')
        run: npx --no-install vitest run --config vitest.windows.config.ts
        timeout-minutes: 15
      - name: Run complete Windows test suite
        if: inputs.checks == 'extended' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target == 'windows')
        run: npx --no-install vitest run --reporter=verbose --exclude '**/test/docx-template-fidelity*' --exclude '**/test/ppt-personal-templates*' --exclude '**/test/ppt-import-memory*' --exclude '**/test/ppt-personal-template-ui*' --exclude '**/test/ppt-windows-font-layout*'
        timeout-minutes: 15
      - name: Verify PPT generation leaves tracked sources clean
        run: git diff --exit-code -- packages/ppt-runtime scripts/ppt
      - name: Check recovery UI on native Windows at three display scales
        if: github.event_name == 'workflow_dispatch' && inputs.checks == 'extended'
        run: node scripts/check-recovery-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.checks == 'extended'
        with:
          name: windows-recovery-ui
          retention-days: 7
          path: |
            artifacts/recovery-ui/scale-*/*.png
            artifacts/recovery-ui/scale-*/results.json
          if-no-files-found: warn
      - name: Build Windows release package
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        run: node scripts/verify-target.mjs win32 x64 && node scripts/electron-builder-windows.mjs --win --x64 --publish never
      - name: Build isolated Windows development package
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.mode == 'development') }}
        run: node scripts/verify-target.mjs win32 x64 && node scripts/electron-builder-windows.mjs --win --x64 --publish never --config electron-builder.dev.cjs
      - name: Smoke test packaged Windows Harness
        if: github.event_name == 'workflow_dispatch' && inputs.checks == 'extended'
        shell: pwsh
        env:
          SMOKE_EXE: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))) && 'dist\win-unpacked\DSH Desktop.exe' || 'dist-dev\win-unpacked\DSH Desktop Dev.exe' }}
          SMOKE_USERDATA: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))) && 'dsh-desktop' || 'dsh-desktop-dev' }}
        run: |
          $userData = Join-Path $env:APPDATA $env:SMOKE_USERDATA
          $logPath = Join-Path $userData 'logs\harness.log'
          # Run outside the checkout: otherwise Node can silently resolve a
          # missing packaged dependency from the repository's node_modules.
          $sourceExecutable = Get-Item $env:SMOKE_EXE
          $isolatedApp = Join-Path $env:RUNNER_TEMP ('DSH packaged smoke ' + [guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $isolatedApp | Out-Null
          Copy-Item -Path (Join-Path $sourceExecutable.Directory.FullName '*') -Destination $isolatedApp -Recurse
          $executable = Join-Path $isolatedApp $sourceExecutable.Name
          $desktopStdout = Join-Path $env:RUNNER_TEMP 'dsh-packaged-desktop.stdout.log'
          $desktopStderr = Join-Path $env:RUNNER_TEMP 'dsh-packaged-desktop.stderr.log'
          $packagedNode = Join-Path $isolatedApp 'resources\app.asar.unpacked\node_modules\node\bin\node.exe'
          if (Test-Path $packagedNode) { throw 'Standalone Windows node.exe must not be packaged.' }
          # Exercise the actual native binding too; the best-effort fallback
          # must not hide a missing or broken packaged koffi dependency.
          # A Windows GUI-subsystem executable makes PowerShell's '&' return
          # before the Node-mode child exits, leaving $LASTEXITCODE unset.
          function Invoke-ElectronNode([string[]]$nodeArguments) {
            $start = [System.Diagnostics.ProcessStartInfo]::new($executable)
            $start.WorkingDirectory = $isolatedApp
            $start.UseShellExecute = $false
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.Environment['ELECTRON_RUN_AS_NODE'] = '1'
            foreach ($argument in $nodeArguments) { [void]$start.ArgumentList.Add($argument) }
            $child = [System.Diagnostics.Process]::Start($start)
            $stdout = $child.StandardOutput.ReadToEnd()
            $stderr = $child.StandardError.ReadToEnd()
            $child.WaitForExit()
            if ($stdout) { Write-Host $stdout }
            if ($stderr) { Write-Host $stderr }
            return $child.ExitCode
          }
          $koffiProbe = "import { createRequire } from 'node:module'; import { pathToFileURL } from 'node:url'; const require = createRequire(pathToFileURL(process.argv[1])); const resolved = require.resolve('koffi'); if (!resolved.startsWith(process.argv[2])) throw new Error('koffi resolved outside packaged app: ' + resolved); const koffi = require('koffi'); const getCurrentProcessId = koffi.load('kernel32.dll').func('GetCurrentProcessId', 'uint32', []); if (getCurrentProcessId() !== process.pid) throw new Error('Native koffi smoke failed'); console.log('Packaged koffi native binding passed'); process.exit(0);"
          $koffiExitCode = Invoke-ElectronNode @('--input-type=module', '-e', $koffiProbe, (Join-Path $isolatedApp 'resources\app.asar\node_modules\koffi\package.json'), (Join-Path $isolatedApp 'resources\app.asar\node_modules'))
          if ($koffiExitCode -ne 0) { throw "Packaged koffi native binding failed (exit code $koffiExitCode)." }
          # Packages load through app.asar (native files are unpacked beside it).
          $pnpmEntry = Join-Path $isolatedApp 'resources\app.asar\node_modules\pnpm\bin\pnpm.cjs'
          $pnpmExitCode = Invoke-ElectronNode @($pnpmEntry, '--version')
          if ($pnpmExitCode -ne 0) { throw "Packaged pnpm failed under Electron Node mode (exit code $pnpmExitCode)." }
          if (Test-Path $userData) { Remove-Item -Recurse -Force $userData }
          $desktop = Start-Process -FilePath $executable -WorkingDirectory $isolatedApp -PassThru `
            -RedirectStandardOutput $desktopStdout -RedirectStandardError $desktopStderr
          try {
            $deadline = (Get-Date).AddSeconds(75)
            $ready = $false
            $endpoint = $null
            while ((Get-Date) -lt $deadline) {
              if ($desktop.HasExited) {
                throw "DSH Desktop Dev exited before Harness was ready (exit code $($desktop.ExitCode))."
              }
              if (Test-Path $logPath) {
                $log = Get-Content -Raw $logPath
                if (-not [string]::IsNullOrEmpty($log)) {
                  $match = [regex]::Match($log, 'dsh web: (http://127\.0\.0\.1:\d+/\?token=[^\s]+)')
                  if ($match.Success) {
                    try {
                      $authenticatedUrl = $match.Groups[1].Value
                      $response = Invoke-WebRequest `
                        -UseBasicParsing `
                        -Uri $authenticatedUrl `
                        -SessionVariable harnessSession `
                        -TimeoutSec 2
                      if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                        $endpoint = ([uri]$authenticatedUrl).GetLeftPart([System.UriPartial]::Authority)
                        $ready = $true
                        break
                      }
                    } catch { }
                  }
                }
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Packaged Harness did not become ready within 75 seconds.' }

            function Invoke-HarnessRpc([string]$endpointName, [hashtable]$request) {
              $rpcId = [guid]::NewGuid().ToString()
              $body = @{
                type = 'client-request'
                rpcId = $rpcId
                method = $endpointName
                payload = @{ args = @{ request = $request } }
              } | ConvertTo-Json -Depth 8 -Compress
              $response = Invoke-RestMethod `
                -Method Post `
                -Uri "$endpoint/api/$endpointName" `
                -ContentType 'application/json; charset=utf-8' `
                -Body ([System.Text.Encoding]::UTF8.GetBytes($body)) `
                -WebSession $harnessSession `
                -TimeoutSec 30
              if ($response.rpcId -ne $rpcId) { throw "Harness RPC id mismatch for $endpointName." }
              if (-not $response.result.ok) {
                throw "Harness RPC $endpointName failed: $($response.result.error.code): $($response.result.error.message)"
              }
              return $response.result.value
            }

            $workspacePath = Join-Path $env:RUNNER_TEMP '数据项素-工作区'
            New-Item -ItemType Directory -Force -Path $workspacePath | Out-Null
            $workspace = Invoke-HarnessRpc 'workspace/create' @{ path = $workspacePath }
            $session = Invoke-HarnessRpc 'session/create' @{ workspaceId = $workspace.workspace.workspaceId }
            if ([string]::IsNullOrWhiteSpace($session.sessionId)) {
              throw 'Harness did not return a session id for the selected workspace.'
            }

            Start-Sleep -Seconds 20
            $stableLog = Get-Content -Raw $logPath
            $readyMarker = $stableLog.LastIndexOf('[desktop] Harness is ready')
            if ($readyMarker -lt 0) { throw 'Harness readiness marker is missing.' }
            $postReadyLog = $stableLog.Substring($readyMarker)
            if ($postReadyLog -match '\[stderr\]') {
              throw 'Harness reported stderr after becoming ready.'
            }
            if ($stableLog -match '\[node\] Harness process exited') {
              throw 'Harness process exited after workspace and session creation.'
            }
            if ($desktop.HasExited) {
              throw "DSH Desktop Dev exited after workspace and session creation (exit code $($desktop.ExitCode))."
            }
            Write-Host 'Packaged Windows Harness smoke test passed.'
          } finally {
            foreach ($path in @($desktopStdout, $desktopStderr)) {
              if (Test-Path $path) {
                Write-Host "--- $path ---"
                Get-Content $path
              }
            }
            Get-CimInstance Win32_Process -Filter "name='$($sourceExecutable.Name)'" |
              Select-Object ProcessId, ParentProcessId, CommandLine | Format-List | Out-String | Write-Host
            if (Test-Path $logPath) {
              Write-Host '--- harness.log ---'
              Get-Content $logPath
            }
            # The smoke owns only this isolated copy. Kill descendants too, then
            # verify no executable from that copy remains before leaving the step.
            if (-not $desktop.HasExited) {
              try { $desktop.Kill($true) } catch {
                if (-not $desktop.HasExited) { throw }
              }
              if (-not $desktop.WaitForExit(10000)) { throw 'Packaged smoke process did not exit.' }
            }
            $smokeRoot = [System.IO.Path]::GetFullPath($isolatedApp).TrimEnd('\') + '\'
            $cleanupDeadline = (Get-Date).AddSeconds(10)
            do {
              $remaining = @(Get-CimInstance Win32_Process | Where-Object {
                $_.ExecutablePath -and $_.ExecutablePath.StartsWith($smokeRoot, [System.StringComparison]::OrdinalIgnoreCase)
              })
              foreach ($entry in $remaining) {
                $process = Get-Process -Id $entry.ProcessId -ErrorAction SilentlyContinue
                if ($process -and -not $process.HasExited) {
                  try { $process.Kill($true) } catch {
                    if (-not $process.HasExited) { throw }
                  }
                }
              }
              if ($remaining.Count -eq 0) { break }
              Start-Sleep -Milliseconds 200
            } while ((Get-Date) -lt $cleanupDeadline)
            if ($remaining.Count -gt 0) { throw 'Processes from the isolated packaged smoke did not exit.' }
          }
      - name: Archive and verify unpacked Windows payload
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease' || inputs.checks == 'extended'))
        shell: pwsh
        env:
          ARCHIVE_DIST: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))) && 'dist' || 'dist-dev' }}
        run: |
          node scripts/archive-windows-release.mjs "$env:ARCHIVE_DIST"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))
        with:
          name: windows-x64-unsigned
          path: |
            dist/dsh-desktop-windows-x64-setup.exe
            dist/win-unpacked.tar.gz
            dist/dsh-desktop-windows-x64-setup.exe.blockmap
            dist/latest.yml
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.mode == 'development') }}
        with:
          name: windows-x64-dev
          retention-days: 3
          path: |
            dist-dev/dsh-desktop-dev-windows-x64-setup.exe
            dist-dev/dsh-desktop-dev-windows-x64-setup.exe.blockmap
            dist-dev/latest.yml
          compression-level: 0
          if-no-files-found: error

  sign-windows:
    name: Sign Windows package locally with UKey
    needs: [validate-dispatch, windows-x64]
    permissions:
      actions: read
      contents: read
    if: >-
      always() &&
      needs.validate-dispatch.result == 'success' && inputs.mode != 'publish' &&
      ((startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'prerelease'))) && needs.windows-x64.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'resign' && needs.windows-x64.result == 'skipped'))
    runs-on: [self-hosted, macOS, ARM64]
    env:
      CI: 'true'
      JSIGN_VERSION: '7.5'
      JSIGN_SHA256: '602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c'
    steps:
      - uses: actions/checkout@v4
      # Persistent runners retain npm downloads locally; restoring the remote
      # cache duplicates disk usage and can stall release setup for minutes.
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install release tooling
        run: npm ci --ignore-scripts
      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${{ github.ref_name }}"
      - name: Set app version from pre-release tag
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prerelease' && inputs.version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.version }}"
      - name: Set app version from signed version
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'signed' || inputs.mode == 'resign') && inputs.version != ''
        run: npm version --no-git-tag-version --allow-same-version "${{ inputs.version }}"
      - name: Prepare unsigned Windows package
        run: |
          work_dir="$RUNNER_TEMP/dsh-windows-${{ github.run_id }}"
          mkdir -p "$work_dir/release"
          echo "WINDOWS_SIGNING_WORK_DIR=$work_dir" >> "$GITHUB_ENV"
      - name: Bypass runner proxy for artifact transfer
        run: |
          # The runner exports lowercase proxy variables separately on macOS.
          # A step env map cannot specify both cases in GitHub workflow YAML.
          printf 'http_proxy=\nhttps_proxy=\nall_proxy=\nno_proxy=*\n' >> "$GITHUB_ENV"
      - name: Download verified Windows signing inputs in parallel
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.mode == 'resign' && inputs.source_run_id || github.run_id }}
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
          ALL_PROXY: ''
        run: |
          node scripts/download-artifact-ranges.mjs "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" \
            windows-x64-unsigned "$WINDOWS_SIGNING_WORK_DIR/unsigned.zip"
          unzip -q "$WINDOWS_SIGNING_WORK_DIR/unsigned.zip" -d "$WINDOWS_SIGNING_WORK_DIR/release"
          rm "$WINDOWS_SIGNING_WORK_DIR/unsigned.zip"
      - name: Check reused unsigned package version
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'resign'
        run: |
          actual_version="$(node -e 'const fs = require("node:fs"); const yaml = require("js-yaml"); console.log(yaml.load(fs.readFileSync(process.argv[1], "utf8")).version)' "$WINDOWS_SIGNING_WORK_DIR/release/latest.yml")"
          test "$actual_version" = "${{ inputs.version }}" || {
            echo "::error::Unsigned artifact version $actual_version does not match signed_version"
            exit 1
          }
      - name: Download and verify Jsign
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jsign_jar="$WINDOWS_SIGNING_WORK_DIR/jsign-${JSIGN_VERSION}.jar"
          gh release download "$JSIGN_VERSION" --repo ebourg/jsign \
            --pattern "jsign-${JSIGN_VERSION}.jar" --dir "$WINDOWS_SIGNING_WORK_DIR" --clobber
          test -s "$jsign_jar"
          printf '%s  %s\n' "$JSIGN_SHA256" "$jsign_jar" | shasum -a 256 --check
          java -jar "$jsign_jar" --version
          echo "JSIGN_JAR=$jsign_jar" >> "$GITHUB_ENV"
      - name: Sign Windows installer with SafeNet UKey
        env:
          WINDOWS_SIGNING_PIN: ${{ secrets.DESKTOP_WINDOWS_SIGNING_PIN }}
        run: |
          set -euo pipefail
          test -r /usr/local/lib/libeTPkcs11.dylib
          test -n "$WINDOWS_SIGNING_PIN" || { echo "::error::Missing required secret: DESKTOP_WINDOWS_SIGNING_PIN"; exit 1; }
          pin_file="$(mktemp "$WINDOWS_SIGNING_WORK_DIR/jsign-pin.XXXXXX")"
          trap 'rm -f "$pin_file"' EXIT
          chmod 600 "$pin_file"
          printf '%s' "$WINDOWS_SIGNING_PIN" > "$pin_file"
          unset WINDOWS_SIGNING_PIN

          # A missing archive or any failed signing/repackaging step blocks publication.
          test -s "$WINDOWS_SIGNING_WORK_DIR/release/win-unpacked.tar.gz"
          tar -xzf "$WINDOWS_SIGNING_WORK_DIR/release/win-unpacked.tar.gz" -C "$WINDOWS_SIGNING_WORK_DIR/release"
          JSIGN_JAR="$JSIGN_JAR" JSIGN_PIN_FILE="$pin_file" \
            node scripts/sign-windows-unpacked.mjs "$WINDOWS_SIGNING_WORK_DIR/release/win-unpacked"
          rm -f "$WINDOWS_SIGNING_WORK_DIR/release"/*.exe "$WINDOWS_SIGNING_WORK_DIR/release"/*.blockmap
          JSIGN_JAR="$JSIGN_JAR" JSIGN_PIN_FILE="$pin_file" \
            node scripts/electron-builder-windows.mjs --win --x64 --publish never \
            --prepackaged "$WINDOWS_SIGNING_WORK_DIR/release/win-unpacked" \
            --config.directories.output="$WINDOWS_SIGNING_WORK_DIR/release"
          rm -rf "$WINDOWS_SIGNING_WORK_DIR/release/win-unpacked" "$WINDOWS_SIGNING_WORK_DIR/release/win-unpacked.tar.gz"

          installer_count="$(find "$WINDOWS_SIGNING_WORK_DIR/release" -maxdepth 1 -type f -name '*.exe' | wc -l | tr -d ' ')"
          test "$installer_count" = '1'
          installer="$(find "$WINDOWS_SIGNING_WORK_DIR/release" -maxdepth 1 -type f -name '*.exe' -print -quit)"
          for attempt in 1 2 3 4 5 6; do
            if java -jar "$JSIGN_JAR" \
              --storetype ETOKEN \
              --storepass "file:$pin_file" \
              --alg SHA-256 \
              --tsaurl http://timestamp.digicert.com \
              --tsmode RFC3161 \
              --tsretries 3 \
              --tsretrywait 10 \
              --name 'DSH Desktop' \
              --url https://www.dshdesktop.com \
              --verbose \
              "$installer"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::Signing final installer failed after 6 attempts"
              exit 1
            fi
            echo "Signing final installer failed, retrying in $((attempt * 10))s (attempt $attempt/6)..."
            sleep $((attempt * 10))
          done
          java -jar "$JSIGN_JAR" extract --format DER "$installer"
          test -s "$installer.sig"
          rm -f "$installer.sig"
      - name: Rebuild Windows update metadata
        env:
          PRERELEASE_TAG: ${{ inputs.version }}
          SIGNED_VERSION: ${{ inputs.version }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          # Tag pushes use the git tag. Dispatch must not fall back to the
          # branch name, because finalize-windows-release.mjs requires semver.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ "$DISPATCH_MODE" = "prerelease" ]; then
            version="${PRERELEASE_TAG#v}"
          else
            version="${SIGNED_VERSION#v}"
          fi
          node scripts/finalize-windows-release.mjs \
            "$WINDOWS_SIGNING_WORK_DIR/release" \
            "$version"
          test -f "$WINDOWS_SIGNING_WORK_DIR/release/latest.yml"
          test -f "$WINDOWS_SIGNING_WORK_DIR"/release/*.exe.blockmap
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          retention-days: 7
          path: |
            ${{ runner.temp }}/dsh-windows-${{ github.run_id }}/release/dsh-desktop-windows-x64-setup.exe
            ${{ runner.temp }}/dsh-windows-${{ github.run_id }}/release/dsh-desktop-windows-x64-setup.exe.blockmap
            ${{ runner.temp }}/dsh-windows-${{ github.run_id }}/release/latest.yml
          compression-level: 0
          if-no-files-found: error
      - name: Remove local signing files
        if: always()
        run: |
          case "$WINDOWS_SIGNING_WORK_DIR" in
            "$RUNNER_TEMP"/dsh-windows-*) rm -rf "$WINDOWS_SIGNING_WORK_DIR" ;;
            '') ;;
            *) echo "Refusing to remove unexpected signing path: $WINDOWS_SIGNING_WORK_DIR"; exit 1 ;;
          esac

  publish-signed-test:
    name: Upload signed test installers and notify
    needs: [macos, sign-windows]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'signed' &&
      (inputs.target == 'windows' || needs.macos.result == 'success') &&
      (inputs.target == 'macos' || needs.sign-windows.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: inputs.target == 'all' || inputs.target == 'macos'
        with:
          pattern: macos-*
          path: test-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: inputs.target == 'all' || inputs.target == 'windows'
        with:
          name: windows-x64
          path: test-assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install release summary CLI
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          if [ -n "${COPILOT_GITHUB_TOKEN:-}" ]; then
            npm install -g @github/copilot@latest || echo "::warning::Copilot installation failed; test notification will use a short fallback."
          fi
      - name: Upload test installers, verify downloads, and send Feishu notification
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_REPO_ID: alexyaojin/dsh-desktop
          FEISHU_RELEASE_WEBHOOK: ${{ secrets.FEISHU_RELEASE_WEBHOOK }}
          SIGNED_VERSION: ${{ inputs.version }}
          TEST_TARGET: ${{ inputs.target }}
        run: |
          python3 -m venv "$RUNNER_TEMP/test-upload-env"
          "$RUNNER_TEMP/test-upload-env/bin/pip" install -q modelscope
          "$RUNNER_TEMP/test-upload-env/bin/python3" .github/scripts/signed_test_build.py \
            --directory test-assets --target "$TEST_TARGET" \
            --version "$SIGNED_VERSION" --run-id "$GITHUB_RUN_ID"

  publish:
    name: Publish GitHub Release
    concurrency:
      group: desktop-modelscope-release-history
      cancel-in-progress: false
    if: >-
      always() && needs.validate-dispatch.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.mode == 'publish') ||
       (inputs.mode != 'publish' && startsWith(github.ref, 'refs/tags/v') &&
        inputs.version == '' && needs.macos.result == 'success' &&
        needs.sign-windows.result == 'success'))
    needs:
      - validate-dispatch
      - macos
      - sign-windows
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.mode == 'publish' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate original signed release source
        if: inputs.mode == 'publish'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: python3 .github/scripts/validate_publish_source.py
      - name: Bind release identity
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_SHA"
          echo "RELEASE_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        if: inputs.mode != 'publish'
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: inputs.mode != 'publish'
        with:
          name: windows-x64
          path: release-assets
      - name: Download verified signed artifacts from original run
        if: inputs.mode == 'publish'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          artifact-ids: ${{ steps.source.outputs.artifact_ids }}
          path: release-assets
          merge-multiple: true
      - name: Merge macOS update metadata
        run: |
          set -euo pipefail
          node scripts/merge-mac-update-metadata.mjs \
            release-assets/latest-mac-arm64.yml \
            release-assets/latest-mac-x64.yml \
            release-assets/latest-mac.yml
          find release-assets -maxdepth 1 \
            \( -name latest-mac-arm64.yml -o -name latest-mac-x64.yml \) \
            -delete
      - name: Verify release assets before publication
        run: |
          set -euo pipefail
          node scripts/verify-release-assets.mjs release-assets "${RELEASE_TAG#v}"
      - name: Build GitHub release note prompt
        run: |
          set -euo pipefail
          mkdir -p .github/release-artifacts
          git fetch --force --tags
          python3 .github/scripts/github_release_notes.py build-prompt \
            --tag "$RELEASE_TAG" \
            --output .github/release-artifacts/github-release-prompt.txt
      - name: Generate GitHub release note
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          set -euo pipefail
          out=.github/release-artifacts/github-release-notes.md
          if [ -n "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "Generating GitHub release note via Copilot CLI with $RELEASE_NOTES_MODEL..."
            npm install -g @github/copilot@latest || true
            prompt="$(cat .github/release-artifacts/github-release-prompt.txt)"
            error_log="$(mktemp)"
            if copilot -p "$prompt" -s --model "$RELEASE_NOTES_MODEL" --no-ask-user > "$out" 2>"$error_log"; then
              if python3 .github/scripts/github_release_notes.py validate --tag "$RELEASE_TAG" --input "$out"; then
                echo "✅ AI GitHub release note generated and validated with $RELEASE_NOTES_MODEL."
              else
                echo "::warning::Copilot generated a GitHub release note that failed validation; using the deterministic fallback."
                python3 .github/scripts/github_release_notes.py generate-fallback --tag "$RELEASE_TAG" --output "$out"
              fi
            else
              echo "::warning::Copilot failed to generate the GitHub release note with $RELEASE_NOTES_MODEL; using the deterministic fallback."
              sed -n '1,20{s/^/copilot: /;p;}' "$error_log"
              python3 .github/scripts/github_release_notes.py generate-fallback --tag "$RELEASE_TAG" --output "$out"
            fi
            rm -f "$error_log"
          else
            echo "MODELS_TOKEN not set; using the deterministic GitHub release note."
            python3 .github/scripts/github_release_notes.py generate-fallback --tag "$RELEASE_TAG" --output "$out"
          fi
      - name: Generate concise bilingual popup notes
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$COPILOT_GITHUB_TOKEN" || { echo "::error::Missing MODELS_TOKEN; popup notes cannot be generated"; exit 1; }
          python3 .github/scripts/update_popup_notes.py prompt --tag "$RELEASE_TAG" --file .github/release-artifacts/popup-prompt.txt
          copilot -p "$(cat .github/release-artifacts/popup-prompt.txt)" -s --model "$RELEASE_NOTES_MODEL" --no-ask-user --available-tools= --disable-builtin-mcps > .github/release-artifacts/popup-notes.json
          python3 .github/scripts/update_popup_notes.py validate --file .github/release-artifacts/popup-notes.json
      - name: Install Feishu card callback transport
        run: |
          python3 -m venv "$RUNNER_TEMP/release-review-env"
          "$RUNNER_TEMP/release-review-env/bin/pip" install -r .github/scripts/release-review-requirements.txt
          "$RUNNER_TEMP/release-review-env/bin/python" test/feishu-card-sdk.py
      - name: Wait for Feishu release confirmation
        timeout-minutes: 65
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_RELEASE_CHAT_ID: ${{ vars.FEISHU_RELEASE_CHAT_ID }}
          FEISHU_RELEASE_REVIEWER_ID: ${{ vars.FEISHU_RELEASE_REVIEWER_ID }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: 'env GITHUB_SHA="$RELEASE_SOURCE_SHA" "$RUNNER_TEMP/release-review-env/bin/python" .github/scripts/confirm_popup_release.py'
      - name: Inject approved popup notes into update feeds
        run: env GITHUB_SHA="$RELEASE_SOURCE_SHA" node scripts/inject-popup-notes.mjs
      - name: Preserve release review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/release-artifacts/
          retention-days: 30
      - name: Recheck immutable source after human approval
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_publish_source.py > "$RUNNER_TEMP/rechecked-source.json"
          python3 -c 'import json, os; assert json.load(open(os.environ["RUNNER_TEMP"] + "/rechecked-source.json"))["sha"] == os.environ["RELEASE_SOURCE_SHA"], "Release tag changed during approval"'
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=.github/release-artifacts/github-release-notes.md
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --notes-file "$notes" \
              --title "DSH Desktop $RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Mirror release assets to ModelScope
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_REPO_ID: alexyaojin/dsh-desktop
        run: |
          set -euo pipefail
          test -n "$MODELSCOPE_TOKEN" || { echo "::error::Missing secret MODELSCOPE_TOKEN"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/ms-env"
          "$RUNNER_TEMP/ms-env/bin/pip" install -q modelscope
          "$RUNNER_TEMP/ms-env/bin/python3" <<'PY'
          import os, pathlib
          from modelscope.hub.api import HubApi

          api = HubApi()
          token = os.environ["MODELSCOPE_TOKEN"]
          repo_id = os.environ["MODELSCOPE_REPO_ID"]
          tag = os.environ["RELEASE_TAG"]
          src = pathlib.Path("release-assets")

          version = tag[1:] if tag.startswith("v") else tag

          api.upload_folder(
              repo_id=repo_id,
              folder_path=str(src),
              path_in_repo="releases/latest",
              commit_message=f"Release {tag}",
              token=token,
          )
          print(f"✅ Uploaded {src} -> {repo_id}/releases/latest")

          # Immutable per-version archive so the desktop client can roll back.
          api.upload_folder(
              repo_id=repo_id,
              folder_path=str(src),
              path_in_repo=f"releases/archive/{version}",
              commit_message=f"Archive {tag}",
              token=token,
          )
          print(f"✅ Archived {src} -> {repo_id}/releases/archive/{version}")

          import sys
          sys.path.insert(0, ".github/scripts")
          from append_version_index import append_version_index
          append_version_index(api, repo_id, token, version)
          print("✅ Appended release to releases/versions.json")
          PY

      - name: Configure initial 5% rollout on crash service
        env:
          CRASH_ADMIN_TOKEN: ${{ secrets.CRASH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CRASH_ADMIN_TOKEN:-}" ]; then
            echo "⚠️ CRASH_ADMIN_TOKEN secret not set; skipping rollout configuration."
            exit 0
          fi
          node scripts/configure-rollout.mjs "${RELEASE_TAG#v}" 5

      - name: Build Feishu release note prompt
        run: |
          set -euo pipefail
          mkdir -p .github/release-artifacts
          git fetch --force --tags
          python3 .github/scripts/feishu_release_notes.py build-prompt \
            --tag "$RELEASE_TAG" \
            --output .github/release-artifacts/feishu-release-prompt.txt

      - name: Generate bilingual Feishu release note
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "Generating release notes via Copilot CLI with $RELEASE_NOTES_MODEL..."
            npm install -g @github/copilot@latest || true
            prompt="$(cat .github/release-artifacts/feishu-release-prompt.txt)"
            out=.github/release-artifacts/feishu-release-notes.md
            error_log="$(mktemp)"
            if copilot -p "$prompt" -s --model "$RELEASE_NOTES_MODEL" --no-ask-user > "$out" 2>"$error_log"; then
              if python3 .github/scripts/feishu_release_notes.py validate --tag "$RELEASE_TAG" --input "$out"; then
                echo "✅ AI release notes generated and validated with $RELEASE_NOTES_MODEL."
              else
                echo "::warning::Copilot generated release notes that failed validation; using the deterministic fallback."
                python3 .github/scripts/feishu_release_notes.py generate-fallback \
                  --tag "$RELEASE_TAG" \
                  --output "$out"
              fi
            else
              echo "::warning::Copilot failed to generate release notes with $RELEASE_NOTES_MODEL; using the deterministic fallback."
              sed -n '1,20{s/^/copilot: /;p;}' "$error_log"
              python3 .github/scripts/feishu_release_notes.py generate-fallback \
                --tag "$RELEASE_TAG" \
                --output "$out"
            fi
            rm -f "$error_log"
          else
            echo "Generating release notes from git evidence..."
            python3 .github/scripts/feishu_release_notes.py generate-fallback \
              --tag "$RELEASE_TAG" \
              --output .github/release-artifacts/feishu-release-notes.md
          fi

      - name: Send Feishu release success notification
        if: success()
        env:
          FEISHU_RELEASE_WEBHOOK: ${{ secrets.FEISHU_RELEASE_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${FEISHU_RELEASE_WEBHOOK:-}" ]; then
            echo "⚠️ FEISHU_RELEASE_WEBHOOK secret not set; skipping notification."
            exit 0
          fi
          python3 .github/scripts/feishu_release_notes.py send \
            --tag "$RELEASE_TAG" \
            --notes .github/release-artifacts/feishu-release-notes.md \
            --webhook "$FEISHU_RELEASE_WEBHOOK"

  publish-prerelease:
    name: Publish GitHub Pre-release
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'prerelease' &&
      inputs.target == 'all' &&
      inputs.version != '' &&
      needs.macos.result == 'success' &&
      needs.sign-windows.result == 'success'
    needs:
      - macos
      - sign-windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release-assets
      - name: Merge macOS update metadata
        run: |
          set -euo pipefail
          node scripts/merge-mac-update-metadata.mjs \
            release-assets/latest-mac-arm64.yml \
            release-assets/latest-mac-x64.yml \
            release-assets/latest-mac.yml
          find release-assets -maxdepth 1 \
            \( -name latest-mac-arm64.yml -o -name latest-mac-x64.yml \) \
            -delete
      - name: Verify release assets before publication
        run: node scripts/verify-release-assets.mjs release-assets "${{ inputs.version }}"
      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --prerelease \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "DSH Desktop $RELEASE_TAG（预发布）" \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Mirror pre-release assets to ModelScope
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_REPO_ID: alexyaojin/dsh-desktop
          PRERELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "$MODELSCOPE_TOKEN" || { echo "::error::Missing secret MODELSCOPE_TOKEN"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/ms-env"
          "$RUNNER_TEMP/ms-env/bin/pip" install -q modelscope
          "$RUNNER_TEMP/ms-env/bin/python3" <<'PY'
          import os, pathlib
          from modelscope.hub.api import HubApi

          api = HubApi()
          token = os.environ["MODELSCOPE_TOKEN"]
          repo_id = os.environ["MODELSCOPE_REPO_ID"]
          tag = os.environ["PRERELEASE_TAG"]
          src = pathlib.Path("release-assets")

          for path_in_repo in (f"releases/prerelease/{tag}", "releases/prerelease/latest"):
              api.upload_folder(
                  repo_id=repo_id,
                  folder_path=str(src),
                  path_in_repo=path_in_repo,
                  commit_message=f"Pre-release {tag}",
                  token=token,
              )
              print(f"✅ Uploaded {src} -> {repo_id}/{path_in_repo}")
          PY

      - name: Build Feishu prerelease note prompt
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p .github/release-artifacts
          git fetch --force --tags
          python3 .github/scripts/feishu_release_notes.py build-prompt \
            --tag "$RELEASE_TAG" \
            --prerelease \
            --output .github/release-artifacts/feishu-release-prompt.txt

      - name: Generate bilingual Feishu prerelease note
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "Generating prerelease notes via Copilot CLI with $RELEASE_NOTES_MODEL..."
            npm install -g @github/copilot@latest || true
            prompt="$(cat .github/release-artifacts/feishu-release-prompt.txt)"
            out=.github/release-artifacts/feishu-release-notes.md
            error_log="$(mktemp)"
            if copilot -p "$prompt" -s --model "$RELEASE_NOTES_MODEL" --no-ask-user > "$out" 2>"$error_log"; then
              if python3 .github/scripts/feishu_release_notes.py validate --tag "$RELEASE_TAG" --prerelease --input "$out"; then
                echo "✅ AI prerelease notes generated and validated with $RELEASE_NOTES_MODEL."
              else
                echo "::warning::Copilot generated prerelease notes that failed validation; using the deterministic fallback."
                python3 .github/scripts/feishu_release_notes.py generate-fallback \
                  --tag "$RELEASE_TAG" \
                  --prerelease \
                  --output "$out"
              fi
            else
              echo "::warning::Copilot failed to generate prerelease notes with $RELEASE_NOTES_MODEL; using the deterministic fallback."
              sed -n '1,20{s/^/copilot: /;p;}' "$error_log"
              python3 .github/scripts/feishu_release_notes.py generate-fallback \
                --tag "$RELEASE_TAG" \
                --prerelease \
                --output "$out"
            fi
            rm -f "$error_log"
          else
            echo "Generating prerelease notes from git evidence..."
            python3 .github/scripts/feishu_release_notes.py generate-fallback \
              --tag "$RELEASE_TAG" \
              --prerelease \
              --output .github/release-artifacts/feishu-release-notes.md
          fi

      - name: Send Feishu prerelease success notification
        if: success()
        env:
          FEISHU_RELEASE_WEBHOOK: ${{ secrets.FEISHU_RELEASE_WEBHOOK }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${FEISHU_RELEASE_WEBHOOK:-}" ]; then
            echo "⚠️ FEISHU_RELEASE_WEBHOOK secret not set; skipping notification."
            exit 0
          fi
          python3 .github/scripts/feishu_release_notes.py send \
            --tag "$RELEASE_TAG" \
            --prerelease \
            --notes .github/release-artifacts/feishu-release-notes.md \
            --webhook "$FEISHU_RELEASE_WEBHOOK"
