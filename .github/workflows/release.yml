name: Release desktop installers

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      windows_prerelease_tag:
        description: Optional non-v tag for a Windows Dev pre-release
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-apple-silicon:
    name: macOS Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${{ github.ref_name }}"
      - run: npm ci
      - run: npm test -- test/update.test.ts test/sidebar-update-control.test.ts test/release.test.ts test/macos-self-signed-update.test.ts test/macos-package-runtime.test.ts test/brand-migration.test.ts
      - run: npm run typecheck
      - name: Validate Sherlock signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_LINK: ${{ secrets.SHERLOCK_MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.SHERLOCK_MACOS_CSC_KEY_PASSWORD }}
        run: |
          required=(CSC_LINK CSC_KEY_PASSWORD)
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
      - name: Prepare macOS signing keychain
        if: startsWith(github.ref, 'refs/tags/v')
        id: signing_keychain
        env:
          CSC_LINK: ${{ secrets.SHERLOCK_MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.SHERLOCK_MACOS_CSC_KEY_PASSWORD }}
        run: node scripts/prepare-macos-signing-keychain.mjs
      - name: Build signed Apple Silicon package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          CSC_NAME: ${{ steps.signing_keychain.outputs.identity }}
        run: npm run package:mac:arm64
      - name: Build unsigned Apple Silicon verification package
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac:arm64
      - name: Preserve Apple Silicon update metadata
        run: mv dist/latest-mac.yml dist/latest-mac-arm64.yml
      - name: Sign Apple Silicon DMG with the Sherlock update identity
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          CSC_IDENTITY: ${{ steps.signing_keychain.outputs.identity }}
        run: |
          dmg_path="dist/sherlock-mac-arm64.dmg"
          test -n "$CSC_IDENTITY" || { echo "::error::Sherlock update identity not found"; exit 1; }
          codesign --keychain "$CSC_KEYCHAIN" --sign "$CSC_IDENTITY" --timestamp=none --force "$dmg_path"
      - name: Refresh Apple Silicon update metadata after DMG signing
        run: node scripts/refresh-mac-update-metadata.mjs --metadata dist/latest-mac-arm64.yml --dmg dist/sherlock-mac-arm64.dmg
      - name: Remove temporary signing keychain
        if: always() && startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          SIGNING_CERTIFICATE: ${{ steps.signing_keychain.outputs.certificate }}
          SIGNING_PUBLIC_CERTIFICATE: ${{ steps.signing_keychain.outputs.public_certificate }}
          SIGNING_KEYCHAIN_LIST: ${{ steps.signing_keychain.outputs.keychain_list }}
        run: |
          if [ -n "$SIGNING_KEYCHAIN_LIST" ] && [ -f "$SIGNING_KEYCHAIN_LIST" ]; then
            keychains=()
            while IFS= read -r keychain; do
              test -z "$keychain" || keychains+=("$keychain")
            done < "$SIGNING_KEYCHAIN_LIST"
            security list-keychains -d user -s "${keychains[@]}"
            rm -f "$SIGNING_KEYCHAIN_LIST"
          fi
          test -z "$SIGNING_PUBLIC_CERTIFICATE" || security remove-trusted-cert "$SIGNING_PUBLIC_CERTIFICATE" || true
          test -z "$SIGNING_KEYCHAIN" || security delete-keychain "$SIGNING_KEYCHAIN" || rm -f "$SIGNING_KEYCHAIN"
          test -z "$SIGNING_CERTIFICATE" || rm -f "$SIGNING_CERTIFICATE"
          test -z "$SIGNING_PUBLIC_CERTIFICATE" || rm -f "$SIGNING_PUBLIC_CERTIFICATE"
      - name: Verify signed Apple Silicon app and DMG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app_path="dist/mac-arm64/Sherlock.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --verbose=2 dist/sherlock-mac-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-apple-silicon
          path: |
            dist/sherlock-mac-arm64.dmg
            dist/sherlock-mac-arm64.zip
            dist/sherlock-mac-arm64.zip.blockmap
            dist/latest-mac-arm64.yml
          if-no-files-found: error

  macos-intel:
    name: macOS Intel
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${{ github.ref_name }}"
      - run: npm ci
      - run: npm test -- test/update.test.ts test/sidebar-update-control.test.ts test/release.test.ts test/macos-self-signed-update.test.ts test/macos-package-runtime.test.ts test/brand-migration.test.ts
      - run: npm run typecheck
      - name: Validate Sherlock signing secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_LINK: ${{ secrets.SHERLOCK_MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.SHERLOCK_MACOS_CSC_KEY_PASSWORD }}
        run: |
          required=(CSC_LINK CSC_KEY_PASSWORD)
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
      - name: Prepare macOS signing keychain
        if: startsWith(github.ref, 'refs/tags/v')
        id: signing_keychain
        env:
          CSC_LINK: ${{ secrets.SHERLOCK_MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.SHERLOCK_MACOS_CSC_KEY_PASSWORD }}
        run: node scripts/prepare-macos-signing-keychain.mjs
      - name: Build signed Intel package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          CSC_NAME: ${{ steps.signing_keychain.outputs.identity }}
        run: npm run package:mac:x64
      - name: Build unsigned Intel verification package
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:mac:x64
      - name: Preserve Intel update metadata
        run: mv dist/latest-mac.yml dist/latest-mac-x64.yml
      - name: Sign Intel DMG with the Sherlock update identity
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          CSC_IDENTITY: ${{ steps.signing_keychain.outputs.identity }}
        run: |
          dmg_path="dist/sherlock-mac-x64.dmg"
          test -n "$CSC_IDENTITY" || { echo "::error::Sherlock update identity not found"; exit 1; }
          codesign --keychain "$CSC_KEYCHAIN" --sign "$CSC_IDENTITY" --timestamp=none --force "$dmg_path"
      - name: Refresh Intel update metadata after DMG signing
        run: node scripts/refresh-mac-update-metadata.mjs --metadata dist/latest-mac-x64.yml --dmg dist/sherlock-mac-x64.dmg
      - name: Remove temporary signing keychain
        if: always() && startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          SIGNING_CERTIFICATE: ${{ steps.signing_keychain.outputs.certificate }}
          SIGNING_PUBLIC_CERTIFICATE: ${{ steps.signing_keychain.outputs.public_certificate }}
          SIGNING_KEYCHAIN_LIST: ${{ steps.signing_keychain.outputs.keychain_list }}
        run: |
          if [ -n "$SIGNING_KEYCHAIN_LIST" ] && [ -f "$SIGNING_KEYCHAIN_LIST" ]; then
            keychains=()
            while IFS= read -r keychain; do
              test -z "$keychain" || keychains+=("$keychain")
            done < "$SIGNING_KEYCHAIN_LIST"
            security list-keychains -d user -s "${keychains[@]}"
            rm -f "$SIGNING_KEYCHAIN_LIST"
          fi
          test -z "$SIGNING_PUBLIC_CERTIFICATE" || security remove-trusted-cert "$SIGNING_PUBLIC_CERTIFICATE" || true
          test -z "$SIGNING_KEYCHAIN" || security delete-keychain "$SIGNING_KEYCHAIN" || rm -f "$SIGNING_KEYCHAIN"
          test -z "$SIGNING_CERTIFICATE" || rm -f "$SIGNING_CERTIFICATE"
          test -z "$SIGNING_PUBLIC_CERTIFICATE" || rm -f "$SIGNING_PUBLIC_CERTIFICATE"
      - name: Verify signed Intel app and DMG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app_path="dist/mac/Sherlock.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --verbose=2 dist/sherlock-mac-x64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: |
            dist/sherlock-mac-x64.dmg
            dist/sherlock-mac-x64.zip
            dist/sherlock-mac-x64.zip.blockmap
            dist/latest-mac-x64.yml
          if-no-files-found: error

  windows-x64:
    name: Windows x64
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set app version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version --no-git-tag-version --allow-same-version "${{ github.ref_name }}"
      - run: npm ci
      - run: npm test -- test/update.test.ts test/sidebar-update-control.test.ts test/release.test.ts test/brand-migration.test.ts test/runtime.test.ts
      - run: npm run typecheck
      - name: Build Windows release package
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run package:win
      - name: Build isolated Windows development package
        if: github.event_name == 'workflow_dispatch'
        run: npm run package:dev:win
      - name: Smoke test packaged Windows Harness
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $userData = Join-Path $env:APPDATA 'dsh-desktop-dev'
          $logPath = Join-Path $userData 'logs\harness.log'
          $executable = 'dist-dev\win-unpacked\Sherlock Dev.exe'
          if (Test-Path $userData) { Remove-Item -Recurse -Force $userData }
          $desktop = Start-Process -FilePath $executable -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            $ready = $false
            $endpoint = $null
            while ((Get-Date) -lt $deadline) {
              if ($desktop.HasExited) {
                throw "Sherlock Dev exited before Harness was ready (exit code $($desktop.ExitCode))."
              }
              if (Test-Path $logPath) {
                $log = Get-Content -Raw $logPath
                $match = [regex]::Match($log, '\[desktop\] endpoint (http://127\.0\.0\.1:\d+)')
                if ($match.Success) {
                  try {
                    $response = Invoke-WebRequest -UseBasicParsing -Uri $match.Groups[1].Value -TimeoutSec 2
                    if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                      $endpoint = $match.Groups[1].Value
                      $ready = $true
                      break
                    }
                  } catch { }
                }
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Packaged Harness did not become ready within 75 seconds.' }

            function Invoke-HarnessRpc([string]$method, [hashtable]$payload) {
              $rpcId = [guid]::NewGuid().ToString()
              $body = @{
                type = 'client-request'
                rpcId = $rpcId
                method = $method
                payload = $payload
              } | ConvertTo-Json -Depth 8 -Compress
              $response = Invoke-RestMethod `
                -Method Post `
                -Uri "$endpoint/api/$method" `
                -ContentType 'application/json; charset=utf-8' `
                -Body ([System.Text.Encoding]::UTF8.GetBytes($body)) `
                -TimeoutSec 30
              if ($response.rpcId -ne $rpcId) { throw "Harness RPC id mismatch for $method." }
              if (-not $response.result.ok) {
                throw "Harness RPC $method failed: $($response.result.error.code): $($response.result.error.message)"
              }
              return $response.result.value
            }

            $workspacePath = Join-Path $env:RUNNER_TEMP '数据项素-工作区'
            New-Item -ItemType Directory -Force -Path $workspacePath | Out-Null
            $workspace = Invoke-HarnessRpc 'workspace.create' @{ path = $workspacePath }
            $session = Invoke-HarnessRpc 'session.create' @{ workspaceId = $workspace.workspace.workspaceId }
            if ([string]::IsNullOrWhiteSpace($session.sessionId)) {
              throw 'Harness did not return a session id for the selected workspace.'
            }

            Start-Sleep -Seconds 20
            $stableLog = Get-Content -Raw $logPath
            if ($stableLog -match '\[stderr\]') {
              throw 'Harness reported stderr after workspace and session creation.'
            }
            if ($stableLog -match '\[node\] Harness process exited') {
              throw 'Harness process exited after workspace and session creation.'
            }
            if ($desktop.HasExited) {
              throw "Sherlock Dev exited after workspace and session creation (exit code $($desktop.ExitCode))."
            }
            Write-Host 'Packaged Windows Harness smoke test passed.'
          } finally {
            if (Test-Path $logPath) {
              Write-Host '--- harness.log ---'
              Get-Content $logPath
            }
            if (-not $desktop.HasExited) { Stop-Process -Id $desktop.Id -Force }
          }
      - name: Publish validated Windows development pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.windows_prerelease_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_TAG: ${{ inputs.windows_prerelease_tag }}
        run: |
          gh release create $env:PRERELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --prerelease `
            --title 'Sherlock Windows Workspace Test' `
            --notes "Windows x64 development build for validating workspace selection and session startup on affected machines. This build pins Koffi 3.1.5 for the stable native Windows binaries, uses an isolated app identity and user data directory, and has passed a packaged Harness smoke test that creates a Unicode-path workspace and session." `
            'dist-dev/sherlock-dev-windows-x64-setup.exe#Sherlock Dev Windows x64 Setup'
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: windows-x64
          path: |
            dist/sherlock-windows-x64-setup.exe
            dist/sherlock-windows-x64-setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: windows-x64-dev
          path: |
            dist-dev/sherlock-dev-windows-x64-setup.exe
            dist-dev/sherlock-dev-windows-x64-setup.exe.blockmap
            dist-dev/latest.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.macos-apple-silicon.result == 'success' &&
      needs.macos-intel.result == 'success' &&
      needs.windows-x64.result == 'success'
    needs:
      - macos-apple-silicon
      - macos-intel
      - windows-x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Merge macOS update metadata
        run: |
          node scripts/merge-mac-update-metadata.mjs \
            release-assets/latest-mac-arm64.yml \
            release-assets/latest-mac-x64.yml \
            release-assets/latest-mac.yml
          find release-assets -maxdepth 1 \
            \( -name latest-mac-arm64.yml -o -name latest-mac-x64.yml \) \
            -delete
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Sherlock $RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY"
          fi
      - name: Mirror release assets to ModelScope
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_REPO_ID: alexyaojin/dsh-desktop
        run: |
          set -euo pipefail
          test -n "$MODELSCOPE_TOKEN" || { echo "::error::Missing secret MODELSCOPE_TOKEN"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/ms-env"
          "$RUNNER_TEMP/ms-env/bin/pip" install -q modelscope
          "$RUNNER_TEMP/ms-env/bin/python3" <<'PY'
          import os, pathlib
          from modelscope.hub.api import HubApi

          api = HubApi()
          token = os.environ["MODELSCOPE_TOKEN"]
          repo_id = os.environ["MODELSCOPE_REPO_ID"]
          tag = os.environ.get("GITHUB_REF_NAME", "unknown")
          src = pathlib.Path("release-assets")

          api.upload_folder(
              repo_id=repo_id,
              folder_path=str(src),
              path_in_repo="releases/latest",
              commit_message=f"Release {tag}",
              token=token,
          )
          print(f"✅ Uploaded {src} -> {repo_id}/releases/latest")
          PY
      - name: Validate Cloudflare release secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID)
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
      - name: Publish immutable release and promote Cloudflare metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run release:cloudflare -- \
            --bucket sherlock-releases \
            --version "${GITHUB_REF_NAME#v}" \
            --tag "$GITHUB_REF_NAME" \
            --assets release-assets \
            --prepared release-cloudflare
      - name: Verify public Cloudflare update feed
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          metadata_url="https://updates.dshdesktop.com/latest/latest-mac.yml"
          asset_url="https://updates.dshdesktop.com/releases/$GITHUB_REF_NAME/sherlock-mac-arm64.zip"
          curl -fsS "$metadata_url" | grep -F "version: $version"
          curl -fsSI "$metadata_url" | grep -Eiq '^cache-control:.*no-cache'
          curl -fsS --range 0-0 -o /dev/null "$asset_url"
          curl -fsSI "$asset_url" | grep -Eiq '^cache-control:.*immutable'
