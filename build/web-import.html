<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>DSH Desktop</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --canvas: #f7f7f8;
        --surface: #ffffff;
        --surface-soft: #f5f6f7;
        --ink: #18181b;
        --muted: #71717a;
        --line: #e4e4e7;
        --line-strong: #d4d4d8;
        --button: #18181b;
        --button-hover: #303034;
        --primary-ink: #ffffff;
        --danger: #c33b38;
        --shadow: 0 12px 34px rgba(24, 24, 27, 0.1);
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: auto;
        padding: 40px 24px;
        color: var(--ink);
        background: var(--canvas);
      }
      html[data-platform="windows"] body { padding-top: 70px; }
      button { font: inherit; }
      .shell {
        display: flex;
        flex-direction: column;
        width: min(640px, 100%);
        border: 1px solid var(--line);
        border-radius: 20px;
        overflow: hidden;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 26px;
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .brand img { width: 28px; height: 28px; border-radius: 8px; }
      .brand-name { font-size: 14px; font-weight: 650; }
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }
      .content { padding: 28px 32px 24px; }
      .progress, .notice {
        display: none;
        margin: 0 0 16px;
        padding: 11px 13px;
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.55;
      }
      .progress { color: var(--ink); border: 1px solid var(--line); background: var(--surface-soft); }
      .notice { color: var(--danger); background: rgba(195, 59, 56, 0.08); }
      .progress.visible, .notice.visible { display: block; }
      h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 650;
        line-height: 1.35;
        letter-spacing: -0.025em;
      }
      .summary {
        margin: 8px 0 20px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      .stats {
        margin: 0;
        padding: 6px 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface-soft);
        list-style: none;
      }
      .stats li {
        padding: 10px 18px;
        border-top: 1px solid var(--line);
        font-size: 13px;
        font-weight: 600;
      }
      .stats li:first-child { border-top: 0; }
      .plugins { display: none; margin: 14px 0 0; }
      .plugins.visible { display: block; }
      .plugins-label { margin: 0 0 8px; color: var(--muted); font-size: 12px; font-weight: 650; }
      .plugin-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .plugin-list li {
        overflow-wrap: anywhere;
        padding: 4px 0;
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
      }
      .safety { margin: 18px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 9px; margin-top: 22px; }
      .button {
        min-height: 39px;
        padding: 9px 15px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        color: var(--ink);
        background: var(--surface);
        cursor: pointer;
        font-size: 13px;
        font-weight: 620;
      }
      .button.primary { border-color: var(--button); color: var(--primary-ink); background: var(--button); }
      .button.primary:hover { background: var(--button-hover); }
      .button[disabled] { opacity: .55; cursor: default; }
      :root[data-theme="dark"] {
        --canvas: #141416;
        --surface: #202023;
        --surface-soft: #29292d;
        --ink: #f2f2f4;
        --muted: #a5a7ad;
        --line: #3a3a3f;
        --line-strong: #4a4a50;
        --button: #f4f4f5;
        --button-hover: #ffffff;
        --primary-ink: #111217;
        --danger: #ee7772;
        --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --canvas: #141416;
          --surface: #202023;
          --surface-soft: #29292d;
          --ink: #f2f2f4;
          --muted: #a5a7ad;
          --line: #3a3a3f;
          --line-strong: #4a4a50;
          --button: #f4f4f5;
          --button-hover: #ffffff;
          --primary-ink: #111217;
          --danger: #ee7772;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-labelledby="heading">
      <header class="header">
        <div class="brand">
          <img id="icon" alt="" />
          <span class="brand-name" id="brand"></span>
          <span class="badge" id="badge"></span>
        </div>
      </header>
      <section class="content">
        <p class="progress" id="progress"></p>
        <p class="notice" id="notice" role="alert"></p>
        <h1 id="heading"></h1>
        <p class="summary" id="summary"></p>
        <ul class="stats" id="stats"></ul>
        <section class="plugins" id="plugins-wrap">
          <p class="plugins-label" id="plugins-label"></p>
          <ul class="plugin-list" id="plugins"></ul>
        </section>
        <p class="safety" id="safety-note"></p>
        <div class="actions">
          <button class="button" id="skip" type="button"></button>
          <button class="button primary" id="import" type="button"></button>
        </div>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(location.search)
      const model = JSON.parse(params.get('state') || '{}')
      document.documentElement.lang = model.locale === 'zh' ? 'zh-CN' : 'en'
      document.documentElement.dataset.theme = params.get('theme') || 'system'
      if (navigator.platform.toLowerCase().startsWith('win')) {
        document.documentElement.dataset.platform = 'windows'
      }
      document.title = model.heading || 'DSH Desktop'
      const setText = (id, value) => {
        const node = document.getElementById(id)
        if (node) node.textContent = value || ''
      }
      document.getElementById('icon').src = params.get('icon') || 'icon.png'
      setText('brand', model.brand)
      setText('badge', model.badge)
      setText('heading', model.heading)
      setText('summary', model.summary)
      setText('safety-note', model.safetyNote)
      setText('import', model.primaryLabel)
      setText('skip', model.secondaryLabel)
      const stats = document.getElementById('stats')
      for (const line of model.stats || []) {
        const item = document.createElement('li')
        item.textContent = String(line)
        stats.appendChild(item)
      }
      if (Array.isArray(model.plugins) && model.plugins.length > 0) {
        document.getElementById('plugins-wrap').classList.add('visible')
        setText('plugins-label', model.pluginsLabel)
        const list = document.getElementById('plugins')
        for (const plugin of model.plugins) {
          const item = document.createElement('li')
          item.textContent = String(plugin)
          list.appendChild(item)
        }
      }
      if (model.notice) {
        const notice = document.getElementById('notice')
        notice.textContent = model.notice
        notice.classList.add('visible')
      }
      const send = (action) => {
        if (window.dshWebImport && typeof window.dshWebImport.action === 'function') {
          void window.dshWebImport.action(action)
        } else {
          location.href = 'dsh-import://' + action
        }
      }
      const importButton = document.getElementById('import')
      const skipButton = document.getElementById('skip')
      importButton.addEventListener('click', () => {
        importButton.disabled = true
        skipButton.disabled = true
        importButton.textContent = model.primaryBusyLabel
        const progress = document.getElementById('progress')
        progress.textContent = model.primaryBusyLabel
        progress.classList.add('visible')
        send('import')
      })
      skipButton.addEventListener('click', () => {
        importButton.disabled = true
        skipButton.disabled = true
        send('skip')
      })
    </script>
  </body>
</html>
