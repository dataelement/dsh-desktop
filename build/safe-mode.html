<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>DSH Desktop Safe Mode</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --canvas: #f7f7f8; --surface: #fff; --soft: #f5f6f7; --ink: #18181b;
        --muted: #71717a; --line: #e4e4e7; --strong: #d4d4d8;
        --button: #18181b; --button-ink: #fff; --danger: #c33b38; --warning: #a45b00; --success: #267a4a;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; background: transparent; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--ink); background: rgba(18,18,20,.28); }
      button { font: inherit; }
      .shell { display: flex; flex-direction: column; width: min(860px, 100%); max-height: calc(100vh - 48px); overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: 0 22px 64px rgba(24,24,27,.2); }
      .header { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 18px 26px; border-bottom: 1px solid var(--line); }
      .brand { display: flex; align-items: center; gap: 11px; }
      .brand img { width: 28px; height: 28px; border-radius: 8px; }
      .brand-name { font-size: 14px; font-weight: 650; }
      .badge { padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 11px; font-weight: 600; }
      .close { width:32px; height:32px; display:grid; place-items:center; padding:0; border:0; border-radius:9px; color:var(--muted); background:transparent; cursor:pointer; font-size:25px; font-weight:300; line-height:1; }
      .close:hover { color:var(--ink); background:var(--soft); }
      .content { display: flex; flex-direction: column; min-height: 0; padding: 22px 28px 20px; overflow: hidden; }
      .summary, .notice, .safety, .actions, .list-heading, .empty { flex-shrink: 0; }
      h1:empty { display:none; }
      .summary { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.65; }
      .notice { display: none; margin: 0 0 18px; padding: 11px 13px; border-radius: 10px; font-size: 12px; line-height: 1.5; }
      .notice.error { color: var(--danger); background: rgba(195,59,56,.08); }
      .notice.success { color: var(--success); background: rgba(38,122,74,.09); }
      .notice.visible { display: block; }
      .list-card { display: flex; flex-direction: column; min-height: 0; overflow: hidden; margin-top:18px; border: 1px solid var(--line); border-radius: 14px; background: var(--soft); }
      .list-heading { display: flex; justify-content: space-between; align-items: center; min-height: 43px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 650; }
      .select-all { border: 0; color: var(--muted); background: transparent; cursor: pointer; font-size: 12px; font-weight: 600; }
      .plugins { min-height: 0; margin: 0; padding: 0; overflow: auto; list-style: none; }
      .plugins li { border-top: 1px solid var(--line); background: var(--surface); }
      .plugins li:first-child { border-top: 0; }
      .plugin { display: flex; align-items: center; gap: 11px; min-height: 48px; padding: 10px 16px; cursor: pointer; }
      .plugin input { width: 16px; height: 16px; margin: 0; accent-color: var(--button); }
      .plugin-copy { display:flex; flex-direction:column; min-width:0; }
      .plugin-title { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px; }
      .plugin-name { overflow-wrap: anywhere; font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size: 13px; font-weight: 600; }
      .plugin-status { color:var(--danger); font-size:11px; font-weight:650; }
      .plugin-status.warning { color:var(--warning); }
      .plugin-action { margin-top:4px; font-size:11px; font-weight:620; }
      .issue-group { border-top:1px solid var(--line); background:var(--surface); }
      .issue-group:first-child { border-top:0; }
      .issue { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; padding: 13px 16px 10px; cursor:pointer; }
      .issue input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--button); }
      .issue-main { min-width: 0; }
      .issue-title { display:flex; flex-wrap:wrap; align-items:center; gap:7px; }
      .issue-name { overflow-wrap:anywhere; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; font-weight:650; }
      .issue-badge { padding:1px 6px; border-radius:999px; color:var(--danger); background:rgba(195,59,56,.09); font-size:10px; font-weight:700; }
      .issue-meta, .issue-detail, .issue-source, .issue-action { margin-top:4px; color:var(--muted); font-size:11px; line-height:1.45; overflow-wrap:anywhere; }
      .issue-action { color:var(--ink); font-weight:620; }
      .issue-details { margin:0 16px 12px 42px; color:var(--muted); font-size:10px; }
      .issue-details summary { width:max-content; cursor:pointer; font-weight:650; }
      .findings { margin:7px 0 0; padding:8px 10px; border-radius:9px; background:var(--soft); list-style:none; }
      .finding { padding:5px 0; border-top:1px solid var(--line); }
      .finding:first-child { border-top:0; }
      .finding-name { overflow-wrap:anywhere; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; font-weight:650; }
      .finding-detail { margin-top:2px; color:var(--muted); font-size:10px; line-height:1.4; overflow-wrap:anywhere; }
      .empty { display: none; margin: 0; padding: 24px 18px; color: var(--muted); background: var(--surface); text-align: center; font-size: 13px; }
      .empty.visible { display: block; }
      .safety { margin: 15px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:9px; margin-top:22px; }
      .button { min-height: 39px; padding: 9px 15px; border: 1px solid var(--strong); border-radius: 10px; color: var(--ink); background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 620; }
      .button:hover { background: var(--soft); }
      .button.primary { border-color: var(--button); color: var(--button-ink); background: var(--button); }
      .button.danger { color:var(--danger); border-color:rgba(195,59,56,.35); }
      .button.success { color:var(--success); border-color:rgba(38,122,74,.35); }
      .button.success:hover { background:rgba(38,122,74,.08); }
      .button[disabled] { opacity: .55; cursor: default; }
      .plugin-item { display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--line); background:var(--surface); }
      .plugin-item:first-child { border-top:0; }
      .plugin-item .plugin { flex:1 1 auto; min-width:0; }
      .plugin-upgrade-btn { margin-right:14px; min-height:28px; padding:4px 10px; border:1px solid var(--success); border-radius:8px; color:var(--success); background:transparent; cursor:pointer; font-size:11px; font-weight:650; white-space:nowrap; flex:0 0 auto; }
      .plugin-upgrade-btn:hover { background:rgba(38,122,74,.09); }
      .plugin-upgrade-btn[disabled] { opacity:.55; cursor:wait; }
      .plugin-status.success { color:var(--success); }
      .plugin-version { margin-left:4px; color:var(--muted); font-size:11px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .footer { display: flex; flex-shrink: 0; flex-wrap: wrap; align-items: center; gap: 16px; padding: 0 28px 18px; }
      .community { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .community-links { display: flex; align-items: center; gap: 6px; }
      .community a, .community button { display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); text-decoration: none; white-space: nowrap; background: transparent; cursor: pointer; font: inherit; }
      .community a:hover, .community button:hover { color: var(--ink); border-color: var(--muted); }
      .community a:focus-visible, .community button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      .community svg { width: 15px; height: 15px; flex-shrink: 0; }
      .community button { background: var(--soft, var(--surface-soft)); }
      .community a { padding-inline: 4px; border-color: transparent; border-radius: 4px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
      .community a:hover { border-color: transparent; text-decoration-color: currentColor; }
      .community .external-icon { width: 12px; height: 12px; }
      .wechat-popover { position: fixed; inset: auto; margin: 0; width: 226px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: var(--surface); box-shadow: 0 8px 28px rgba(0,0,0,.16); font-size: 12px; text-align: center; }
      .wechat-popover img { display: block; width: 200px; height: 200px; background: #fff; border-radius: 6px; }
      .wechat-popover p { margin: 10px 0 0; line-height: 1.5; }
      .footer > #quit { margin-left: auto; flex-shrink: 0; }
      .quit { border: 0; color: var(--muted); background: transparent; cursor: pointer; font-size: 12px; font-weight: 600; }
      :root[data-theme="dark"] { --canvas:#141416; --surface:#202023; --soft:#29292d; --ink:#f2f2f4; --muted:#a5a7ad; --line:#3a3a3f; --strong:#4a4a50; --button:#f4f4f5; --button-ink:#111217; --danger:#ee7772; --success:#78d59a; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --canvas:#141416; --surface:#202023; --soft:#29292d; --ink:#f2f2f4; --muted:#a5a7ad; --line:#3a3a3f; --strong:#4a4a50; --button:#f4f4f5; --button-ink:#111217; --danger:#ee7772; --success:#78d59a; } }
      @media (max-height: 680px) { body { padding: 16px; } .shell { max-height: calc(100vh - 32px); } .header { padding-block: 12px; } .content { padding: 16px 24px; } .summary { font-size: 13px; margin-bottom: 6px; } .list-card { margin-top: 10px; } .actions { margin-top: 14px; } }
      @media (max-width: 620px) { body { display:block; padding:46px 0 0; background:var(--surface); } .shell { width:100%; min-height:calc(100vh - 46px); max-height:none; border:0; border-radius:0; box-shadow:none; } .content { max-height:none; padding:24px 20px; } .actions { flex-direction:column-reverse; } .button { width:100%; } .footer { padding-inline:20px; } }
    </style>
  </head>
  <body>
    <main class="shell" role="dialog" aria-modal="true" aria-labelledby="badge">
      <header class="header">
        <div class="brand"><img id="icon" alt="" /><span class="brand-name" id="brand"></span><span class="badge" id="badge"></span></div>
        <button class="close" id="agent" type="button" aria-label="Close">×</button>
      </header>
      <section class="content">
        <p class="notice" id="notice" role="alert"></p>
        <h1 id="heading"></h1>
        <p class="summary" id="summary"></p>
        <section class="list-card" aria-labelledby="selection-hint">
          <div class="list-heading"><span id="selection-hint"></span><button class="select-all" id="select-all" type="button"></button></div>
          <ul class="plugins" id="items"></ul>
          <p class="empty" id="empty"></p>
        </section>
        <p class="safety" id="safety-note"></p>
        <div class="actions">
          <button class="button" id="recovery-open" type="button" hidden></button>
          <button class="button success" id="upgrade-all" type="button" hidden></button>
          <button class="button" id="apply" type="button" disabled></button>
          <button class="button primary" id="restart" type="button"></button>
        </div>
      </section>
      <footer class="footer">
        <aside class="community" aria-labelledby="community-label">
          <span id="community-label"></span>
          <span class="community-links">
            <button id="community-wechat" type="button" aria-expanded="false" aria-controls="wechat-popover">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="6" height="6" rx="1" />
                <rect x="15" y="3" width="6" height="6" rx="1" />
                <rect x="3" y="15" width="6" height="6" rx="1" />
                <path d="M15 15h3v3h3v3h-6v-3m6-6v3M3 12h3m6-9v3m0 6v3m0 6v-3" />
              </svg>
              <span id="community-wechat-label"></span>
            </button>
            <a id="community-discord" href="https://discord.gg/he2gAKCpj" target="_blank" rel="noopener noreferrer">
              <span>Discord</span>
              <svg class="external-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 12 12 4M5 4h7v7" />
              </svg>
            </a>
          </span>
        </aside>
        <button class="quit" id="quit" type="button"></button>
      </footer>
    </main>
    <div id="wechat-popover" class="wechat-popover" popover="auto" role="region" aria-labelledby="wechat-caption">
      <img id="wechat-qr" src="community-wechat-qr.png" width="200" height="200" alt="" />
      <p id="wechat-caption"></p>
    </div>
    <script>
      const params = new URLSearchParams(location.search)
      const model = JSON.parse(params.get('state') || '{}')
      document.documentElement.lang = model.locale === 'zh' ? 'zh-CN' : 'en'
      document.documentElement.dataset.theme = params.get('theme') || 'system'
      document.title = `${model.badge || 'Safe Mode'} · ${model.brand || 'DSH Desktop'}`
      const setText = (id, value) => { const node = document.getElementById(id); if (node) node.textContent = value || '' }
      document.getElementById('icon').src = params.get('icon') || 'icon.png'
      setText('brand', model.brand)
      setText('badge', model.badge)
      setText('heading', model.heading)
      setText('summary', model.summary)
      setText('empty', model.emptyMessage)
      setText('selection-hint', model.selectionHint)
      setText('safety-note', model.safetyNote)
      setText('apply', model.applyLabel)
      setText('restart', model.restartLabel)
      setText('quit', model.quitLabel)
      setText('community-label', model.locale === 'zh' ? '遇到问题？来社区交流' : 'Need help? Join our community')
      setText('community-wechat-label', model.locale === 'zh' ? '微信群' : 'WeChat')
      setText('wechat-caption', model.locale === 'zh' ? '扫码加入 DSH 用户群' : 'Scan to join the DSH community')
      const wechat = document.getElementById('community-wechat')
      const wechatPopover = document.getElementById('wechat-popover')
      document.getElementById('wechat-qr').alt = model.locale === 'zh' ? 'DSH 用户群二维码' : 'DSH community WeChat QR code'
      let wechatCloseTimer
      const positionWechat = () => {
        const anchor = wechat.getBoundingClientRect()
        const popup = wechatPopover.getBoundingClientRect()
        const left = Math.max(12, Math.min(anchor.left, innerWidth - popup.width - 12))
        const top = Math.max(12, Math.min(anchor.top - popup.height - 8, innerHeight - popup.height - 12))
        wechatPopover.style.left = `${left}px`
        wechatPopover.style.top = `${top}px`
      }
      const openWechat = () => {
        clearTimeout(wechatCloseTimer)
        if (!wechatPopover.matches(':popover-open')) wechatPopover.showPopover()
        positionWechat()
      }
      const closeWechat = () => {
        clearTimeout(wechatCloseTimer)
        if (wechatPopover.matches(':popover-open')) wechatPopover.hidePopover()
      }
      const scheduleWechatClose = () => {
        clearTimeout(wechatCloseTimer)
        wechatCloseTimer = setTimeout(() => {
          if (!wechat.matches(':hover') && !wechatPopover.matches(':hover') && document.activeElement !== wechat) closeWechat()
        }, 150)
      }
      wechat.addEventListener('pointerenter', openWechat)
      wechat.addEventListener('pointerleave', scheduleWechatClose)
      wechat.addEventListener('focus', openWechat)
      wechat.addEventListener('blur', scheduleWechatClose)
      wechat.addEventListener('click', openWechat)
      wechatPopover.addEventListener('pointerenter', () => clearTimeout(wechatCloseTimer))
      wechatPopover.addEventListener('pointerleave', scheduleWechatClose)
      wechatPopover.addEventListener('toggle', () => wechat.setAttribute('aria-expanded', String(wechatPopover.matches(':popover-open'))))
      window.addEventListener('resize', closeWechat)
      document.addEventListener('scroll', closeWechat, true)
      document.getElementById('community-discord').title = model.locale === 'zh'
        ? '在浏览器中打开 Discord 社区'
        : 'Open our Discord community in your browser'
      setText('select-all', model.selectAllLabel)
      setText('recovery-open', model.recoveryOpenLabel)
      document.getElementById('agent').setAttribute('aria-label', model.agentLabel || 'Close')
      const notice = document.getElementById('notice')
      if (model.notice) {
        notice.textContent = model.notice
        notice.classList.add('visible', model.noticeTone === 'success' ? 'success' : 'error')
      }
      const list = document.getElementById('items')
      const empty = document.getElementById('empty')
      const apply = document.getElementById('apply')
      const upgradeAll = document.getElementById('upgrade-all')
      const recoveryOpen = document.getElementById('recovery-open')
      const agent = document.getElementById('agent')
      const restart = document.getElementById('restart')
      if (model.recoveryLocked === true) {
        document.querySelector('.list-card').hidden = true
        document.getElementById('safety-note').hidden = true
        apply.hidden = true
        recoveryOpen.hidden = false
      }
      if (model.upgradeAllLabel && model.upgradeReadyCount > 0 && model.recoveryLocked !== true) {
        upgradeAll.hidden = false
        upgradeAll.textContent = model.upgradeAllLabel
      }
      const pluginCheckboxes = []
      const issueCheckboxes = []
      for (const group of Array.isArray(model.issueGroups) ? model.issueGroups : []) {
        const item = document.createElement('li'); item.className = 'issue-group'
        const label = document.createElement('label'); label.className = 'issue'
        const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.value = String(group.id); checkbox.dataset.issueIds = JSON.stringify(group.issueIds || [])
        const main = document.createElement('span'); main.className = 'issue-main'
        const title = document.createElement('span'); title.className = 'issue-title'
        const name = document.createElement('span'); name.className = 'issue-name'; name.textContent = String(group.name)
        const badge = document.createElement('span'); badge.className = 'issue-badge'; badge.textContent = String(group.severityLabel)
        title.append(name, badge); main.appendChild(title)
        const meta = document.createElement('div'); meta.className = 'issue-meta'; meta.textContent = [group.kindLabel, group.countLabel].filter(Boolean).join(' · '); main.appendChild(meta)
        const action = document.createElement('div'); action.className = 'issue-action'; action.textContent = String(group.actionLabel || ''); main.appendChild(action)
        if ((group.issueIds || []).length > 0) { label.appendChild(checkbox); issueCheckboxes.push(checkbox) }
        label.appendChild(main); item.appendChild(label); list.appendChild(item)
        const details = document.createElement('details'); details.className = 'issue-details'
        const detailsSummary = document.createElement('summary'); detailsSummary.textContent = String(group.detailLabel || group.countLabel || '')
        const findings = document.createElement('ul'); findings.className = 'findings'
        for (const issue of Array.isArray(group.issues) ? group.issues : []) {
          const finding = document.createElement('li'); finding.className = 'finding'
          const findingName = document.createElement('div'); findingName.className = 'finding-name'; findingName.textContent = String(issue.packageName)
          const findingDetail = document.createElement('div'); findingDetail.className = 'finding-detail'; findingDetail.textContent = [issue.kindLabel, issue.versionLabel, issue.detail].filter(Boolean).join(' · ')
          finding.append(findingName, findingDetail); findings.appendChild(finding)
        }
        details.append(detailsSummary, findings); item.appendChild(details)
      }
      const pluginItems = Array.isArray(model.pluginItems)
        ? model.pluginItems
        : (Array.isArray(model.plugins) ? model.plugins : []).map((name) => ({ name }))
      for (const plugin of pluginItems) {
        const item = document.createElement('li')
        item.className = 'plugin-item'
        const label = document.createElement('label'); label.className = 'plugin'
        const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.value = String(plugin.name)
        const copy = document.createElement('span'); copy.className = 'plugin-copy'
        const title = document.createElement('span'); title.className = 'plugin-title'
        const name = document.createElement('span'); name.className = 'plugin-name'; name.textContent = String(plugin.name)
        title.appendChild(name)
        if (plugin.installedVersion) {
          const ver = document.createElement('span')
          ver.className = 'plugin-version'
          ver.textContent = `v${plugin.installedVersion}`
          title.appendChild(ver)
        }
        if (plugin.statusLabel) {
          const status = document.createElement('span'); status.className = 'plugin-status'; status.textContent = String(plugin.statusLabel)
          if (plugin.statusTone === 'warning') status.classList.add('warning')
          else if (plugin.statusTone === 'success') status.classList.add('success')
          title.appendChild(status)
        }
        const action = document.createElement('span'); action.className = 'plugin-action'; action.textContent = String(plugin.actionLabel || '')
        copy.append(title, action)
        label.append(checkbox, copy); item.appendChild(label)

        if (plugin.upgradeButtonLabel) {
          const upgradeBtn = document.createElement('button')
          upgradeBtn.type = 'button'
          upgradeBtn.className = 'plugin-upgrade-btn'
          upgradeBtn.textContent = String(plugin.upgradeButtonLabel)
          upgradeBtn.addEventListener('click', (e) => {
            e.stopPropagation()
            upgradeBtn.disabled = true
            upgradeBtn.textContent = model.locale === 'zh' ? '正在升级…' : 'Upgrading…'
            apply.disabled = true
            if (upgradeAll) upgradeAll.disabled = true
            restart.disabled = true
            agent.disabled = true
            void window.dshSafeMode.action('upgrade', { plugins: [plugin.name] })
          })
          item.appendChild(upgradeBtn)
        }

        list.appendChild(item); pluginCheckboxes.push(checkbox)
      }
      const allCheckboxes = [...issueCheckboxes, ...pluginCheckboxes]
      if (allCheckboxes.length === 0) empty.classList.add('visible')
      const updateSelection = () => { apply.disabled = !allCheckboxes.some((checkbox) => checkbox.checked) }
      for (const checkbox of allCheckboxes) checkbox.addEventListener('change', updateSelection)
      document.getElementById('select-all').addEventListener('click', () => { const selected = allCheckboxes.every((checkbox) => checkbox.checked); for (const checkbox of allCheckboxes) checkbox.checked = !selected; updateSelection() })
      apply.addEventListener('click', () => {
        const plugins = pluginCheckboxes.filter((checkbox) => checkbox.checked).map((checkbox) => checkbox.value)
        const issues = issueCheckboxes.filter((checkbox) => checkbox.checked).flatMap((checkbox) => {
          try { return JSON.parse(checkbox.dataset.issueIds || '[]') } catch { return [] }
        })
        if (plugins.length === 0 && issues.length === 0) return
        apply.disabled = true; apply.textContent = model.applyBusyLabel; agent.disabled = true; restart.disabled = true
        if (upgradeAll) upgradeAll.disabled = true
        void window.dshSafeMode.action('apply', { plugins, issues })
      })
      upgradeAll.addEventListener('click', () => {
        const targets = pluginItems.filter((p) => p.upgradeReady).map((p) => p.name)
        if (targets.length === 0) return
        upgradeAll.disabled = true
        upgradeAll.textContent = model.upgradeAllBusyLabel || (model.locale === 'zh' ? '正在升级…' : 'Upgrading…')
        apply.disabled = true
        restart.disabled = true
        agent.disabled = true
        void window.dshSafeMode.action('upgrade', { plugins: targets })
      })
      recoveryOpen.addEventListener('click', () => { recoveryOpen.disabled = true; void window.dshSafeMode.action('recovery-open', {}) })
      agent.addEventListener('click', () => { agent.disabled = true; agent.textContent = model.agentBusyLabel; apply.disabled = true; restart.disabled = true; if (upgradeAll) upgradeAll.disabled = true; void window.dshSafeMode.action('agent', {}) })
      restart.addEventListener('click', () => {
        if (model.restartConfirm && !window.confirm(String(model.restartConfirm))) return
        restart.disabled = true; restart.textContent = model.restartBusyLabel; apply.disabled = true; agent.disabled = true; if (upgradeAll) upgradeAll.disabled = true; void window.dshSafeMode.action('restart', {})
      })
      document.getElementById('quit').addEventListener('click', () => void window.dshSafeMode.action('quit', {}))
    </script>
  </body>
</html>
