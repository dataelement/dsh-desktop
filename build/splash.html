<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --surface: #f8f8f6;
        --logo-filter: none;
        --sheen-filter: invert(1);
        --keyhole-glow: rgba(104, 120, 151, 0.2);
        --label: #17181a;
        --secondary-label: #777a80;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        color: var(--label);
        background: var(--surface);
      }
      main {
        display: grid;
        justify-items: center;
        gap: 10px;
        padding: 32px;
        text-align: center;
      }
      .logo-stage {
        position: relative;
        width: min(212px, 42vw);
        aspect-ratio: 1317 / 180;
        isolation: isolate;
      }
      .logo-reveal {
        position: absolute;
        inset: 0;
        animation: logo-reveal 620ms cubic-bezier(0.22, 0.76, 0.24, 1) both;
      }
      .logo-mark {
        display: block;
        width: 100%;
        height: 100%;
        filter: var(--logo-filter);
      }
      .logo-sheen {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        filter: var(--sheen-filter);
        clip-path: polygon(-28% 0, -12% 0, -22% 100%, -38% 100%);
        animation: logo-sheen 5.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) 900ms infinite;
        pointer-events: none;
      }
      .keyhole-pulse {
        position: absolute;
        z-index: -1;
        left: 68.45%;
        top: 50%;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--keyhole-glow) 0 14%, transparent 62%);
        filter: blur(2px);
        transform: translate(-50%, -50%) scale(0.82);
        animation: keyhole-breathe 3.4s ease-in-out 620ms infinite;
        pointer-events: none;
      }
      .status {
        margin: 0;
        color: var(--secondary-label);
        font-size: 12px;
        letter-spacing: 0.02em;
      }
      @keyframes logo-reveal {
        from {
          opacity: 0.18;
          clip-path: inset(0 100% 0 0);
          transform: translateY(2px) scale(0.985);
        }
        68% { opacity: 1; }
        to {
          opacity: 1;
          clip-path: inset(0 0 0 0);
          transform: translateY(0) scale(1);
        }
      }
      @keyframes logo-sheen {
        0%, 20% {
          clip-path: polygon(-28% 0, -12% 0, -22% 100%, -38% 100%);
          opacity: 0;
        }
        32% { opacity: 0.18; }
        70% { opacity: 0.18; }
        82%, 100% {
          clip-path: polygon(138% 0, 154% 0, 144% 100%, 128% 100%);
          opacity: 0;
        }
      }
      @keyframes keyhole-breathe {
        0%, 100% { opacity: 0.16; transform: translate(-50%, -50%) scale(0.82); }
        50% { opacity: 0.55; transform: translate(-50%, -50%) scale(1.08); }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #141416;
          --logo-filter: invert(1);
          --sheen-filter: none;
          --keyhole-glow: rgba(190, 203, 229, 0.22);
          --label: #f3f4f6;
          --secondary-label: #9ca0a8;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .logo-reveal { animation: none; }
        .logo-sheen, .keyhole-pulse { display: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo-stage" role="img" aria-label="Sherlock">
        <span class="keyhole-pulse" aria-hidden="true"></span>
        <div class="logo-reveal" aria-hidden="true">
          <img class="logo-mark" src="sherlock-logo.svg" alt="" />
          <img class="logo-sheen" src="sherlock-logo.svg" alt="" />
        </div>
      </div>
      <p class="status" id="status" aria-live="polite">Starting…</p>
    </main>
    <script>
      if (navigator.language.toLowerCase().startsWith('zh')) {
        document.documentElement.lang = 'zh-CN'
        document.getElementById('status').textContent = '正在启动…'
      }
    </script>
  </body>
</html>
