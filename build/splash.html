<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <script>
      if (navigator.platform.toLowerCase().startsWith('win')) {
        document.documentElement.dataset.platform = 'windows'
      }
    </script>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: #17181a; background: #f8f8f6; }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 12px;
        padding: 32px;
        text-align: center;
      }
      html[data-platform="windows"] main { padding-top: 70px; }
      .mark { width: 196px; height: auto; image-rendering: pixelated; }
      .title { margin: 0; font-size: 23px; font-weight: 650; letter-spacing: -0.02em; }
      .status { margin: -4px 0 0; color: #777a80; font-size: 13px; }
      @media (prefers-color-scheme: dark) {
        body { color: #f3f4f6; background: #141416; }
        .mark { filter: invert(1); }
        .status { color: #9ca0a8; }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="dsh-loader.gif" alt="" />
      <h1 class="title" id="title">Starting DSH Desktop</h1>
      <p class="status" id="status">First launch may take a moment.</p>
    </main>
    <script>
      if (navigator.language.toLowerCase().startsWith('zh')) {
        document.getElementById('title').textContent = '正在启动 DSH Desktop'
        document.getElementById('status').textContent = '首次启动可能需要一点时间。'
      }
    </script>
  </body>
</html>
