<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DSH Desktop</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #fbfbfb; }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        padding: 32px;
      }
      .markFrame { display: grid; place-items: center; width: 100%; transform: translateY(-80px); }
      .mark { display: block; width: min(280px, 100%); height: auto; object-fit: contain; }
    </style>
  </head>
  <body>
    <main aria-label="DSH Desktop">
      <div class="markFrame" aria-hidden="true">
        <!-- Original animation, including its embedded caption, is preserved byte-for-byte. -->
        <img class="mark" src="startup-whale.gif" width="480" height="276" alt="" />
      </div>
    </main>
  </body>
</html>
