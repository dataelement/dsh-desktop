# Sherlock delegates directory selection to Electron's system dialog. Keep
# the renderless client surface, but do not load the Koffi-based Host worker:
# on Windows it can exit before reporting a result inside packaged Electron.
- id: directory-picker
  disabled: true

# Sherlock is provider-neutral. Keep the user-configured providers, but do not
# mount the upstream built-in DeepSeek adapter in the desktop profile.
- id: llm-deepseek
  disabled: true

# Search follows the model selected for the active session. The provider reads
# that route's user-configured endpoint and credential for each request, so the
# desktop never requires or silently falls back to DEEPSEEK_API_KEY.
- id: web
  config:
    searchProvider: sherlock-session-model

- id: web-search-deepseek
  disabled: true

- insert:
    - id: directory-picker-electron-desktop-surface
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    - id: web-search-session-model
      name: dsh-web-search-session-model

    # Sherlock owns the fixed-target dsh-market installer and its lightweight
    # settings entry. After dshmarket is installed and Harness restarts, the
    # community plugin replaces the placeholder with its complete market UI.
    - id: sherlock-market-installer
      # Compatibility: this package name is part of the upstream Harness
      # dependency closure; the plugin's visible identity remains Sherlock.
      name: dsh-desktop-market-installer

    # Canvas generation runs in isolated child sessions owned by Sherlock, so
    # it stays independent from the visible Research conversation.
    - id: sherlock-research-task-runtime
      name: dsh-research-task-runtime

# dsh-market normally offers to restart its own Node process after mutations.
# The desktop shell has the real lifecycle authority, so keep that behavior off
# whenever the optional plugin is present in the composed profile.
- id: dsh-market
  config:
    profile: web
    allowRestart: false
