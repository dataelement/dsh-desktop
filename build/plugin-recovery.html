<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Sherlock</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --canvas: #f7f7f8;
        --surface: #ffffff;
        --surface-soft: #f5f6f7;
        --ink: #18181b;
        --muted: #71717a;
        --faint: #a1a1aa;
        --line: #e4e4e7;
        --line-strong: #d4d4d8;
        --button: #18181b;
        --button-hover: #303034;
        --primary-ink: #ffffff;
        --danger: #c33b38;
        --shadow: 0 12px 34px rgba(24, 24, 27, 0.1);
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: auto;
        padding: 40px 24px;
        color: var(--ink);
        background: var(--canvas);
      }

      button { font: inherit; }
      .shell {
        width: min(700px, 100%);
        border: 1px solid var(--line);
        border-radius: 20px;
        overflow: hidden;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 26px;
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .brand img { width: 28px; height: 28px; border-radius: 8px; }
      .brand-name { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }
      .content { padding: 30px 32px 22px; }
      .progress, .notice {
        display: none;
        margin: 0 0 18px;
        padding: 11px 13px;
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.55;
      }
      .progress { color: var(--ink); border: 1px solid var(--line); background: var(--surface-soft); }
      .notice { color: var(--danger); background: rgba(195, 59, 56, 0.08); }
      .progress.visible, .notice.visible { display: block; }
      h1 {
        margin: 0;
        max-width: 590px;
        font-size: 21px;
        font-weight: 650;
        line-height: 1.35;
        letter-spacing: -0.025em;
      }
      .summary {
        margin: 8px 0 20px;
        max-width: 610px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      .summary:empty { display: none; }
      .summary:empty + .conflict-card { margin-top: 30px; }

      .conflict-card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface-soft);
      }
      .reason {
        padding: 17px 19px 16px;
      }
      .reason-label {
        margin: 0 0 7px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 680;
      }
      .reason-detail {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }
      .plugins {
        display: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--line);
        list-style: none;
      }
      .plugins.visible { display: block; }
      .plugins li {
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 44px;
        padding: 10px 19px;
        border-top: 1px solid var(--line);
      }
      .plugins li:first-child { border-top: 0; }
      .plugin-mark {
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        color: var(--muted);
        background: var(--surface);
        font-size: 12px;
        font-weight: 750;
      }
      .plugin-name {
        min-width: 0;
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
      }

      .safety {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        flex: 0 1 auto;
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .safety-icon {
        width: 17px;
        height: 17px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        margin-top: 1px;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
      }

      .decision-row {
        display: flex;
        align-items: flex-end;
        flex-direction: column;
        gap: 12px;
        margin-top: 22px;
      }
      .actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex: 0 0 auto;
        gap: 9px;
        margin: 0;
      }
      .button {
        min-height: 39px;
        padding: 9px 15px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        color: var(--ink);
        background: var(--surface);
        cursor: pointer;
        font-size: 13px;
        font-weight: 620;
        transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
      }
      .button:hover { background: var(--surface-soft); }
      .button:active { transform: translateY(1px); }
      .button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      .button.primary {
        border-color: var(--button);
        color: var(--primary-ink);
        background: var(--button);
      }
      .button.primary:hover { border-color: var(--button-hover); background: var(--button-hover); }
      .button[disabled] { opacity: 0.64; cursor: wait; transform: none; }

      .advanced {
        margin-top: 24px;
        border-top: 1px solid var(--line);
      }
      .advanced summary {
        display: inline-flex;
        align-items: center;
        padding: 14px 2px 0;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: 630;
        list-style: none;
      }
      .advanced summary::-webkit-details-marker { display: none; }
      .advanced summary::after {
        width: 6px;
        height: 6px;
        margin-left: 8px;
        border-right: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        content: "";
        transform: rotate(-45deg);
        transform-origin: center;
      }
      .advanced[open] summary::after { transform: rotate(45deg) translateY(-1px); }
      .advanced-body { padding: 13px 0 2px; }
      .meta-label {
        margin: 0 0 6px;
        color: var(--faint);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .path, .technical {
        margin: 0 0 14px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.55;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .advanced-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .text-button {
        min-height: 32px;
        padding: 5px 9px;
        border: 0;
        border-radius: 7px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
      }
      .text-button:hover { color: var(--ink); background: var(--surface-soft); }
      .text-button.danger:hover { color: var(--danger); background: rgba(195, 59, 56, 0.08); }
      .footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 16px;
        padding: 11px 26px;
        border-top: 1px solid var(--line);
        color: var(--faint);
        background: var(--surface);
        font-size: 11px;
      }
      @media (max-width: 620px) {
        body { display: block; padding: 46px 0 0; background: var(--surface); }
        .shell { width: 100%; min-height: calc(100vh - 46px); border: 0; border-radius: 0; box-shadow: none; }
        .header { padding-inline: 20px; }
        .content { padding: 24px 20px 16px; }
        .decision-row { align-items: stretch; }
        .actions { align-items: stretch; flex-direction: column-reverse; }
        .button { width: 100%; }
        .footer { padding-inline: 20px; }
      }

      :root[data-theme="dark"] {
        --canvas: #141416;
        --surface: #202023;
        --surface-soft: #29292d;
        --ink: #f2f2f4;
        --muted: #a5a7ad;
        --faint: #7f8289;
        --line: #3a3a3f;
        --line-strong: #4a4a50;
        --button: #f4f4f5;
        --button-hover: #ffffff;
        --primary-ink: #111217;
        --danger: #ee7772;
        --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --canvas: #141416;
          --surface: #202023;
          --surface-soft: #29292d;
          --ink: #f2f2f4;
          --muted: #a5a7ad;
          --faint: #7f8289;
          --line: #3a3a3f;
          --line-strong: #4a4a50;
          --button: #f4f4f5;
          --button-hover: #ffffff;
          --primary-ink: #111217;
          --danger: #ee7772;
          --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .button { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-labelledby="heading">
      <header class="header">
        <div class="brand">
          <img id="icon" alt="" />
          <span class="brand-name" id="brand"></span>
          <span class="badge" id="badge"></span>
        </div>
      </header>

      <section class="content">
        <p class="progress" id="progress"></p>
        <p class="notice" id="notice" role="alert"></p>
        <h1 id="heading"></h1>
        <p class="summary" id="summary"></p>

        <section class="conflict-card" aria-label="Plugin recovery details">
          <div class="reason">
            <p class="reason-label" id="reason-title"></p>
            <p class="reason-detail" id="reason-detail"></p>
          </div>
          <ul class="plugins" id="plugins"></ul>
        </section>

        <div class="decision-row">
          <div class="actions">
            <button class="button primary" id="primary" type="button"></button>
          </div>
          <p class="safety">
            <span class="safety-icon" aria-hidden="true">✓</span>
            <span id="safety-note"></span>
          </p>
        </div>

        <details class="advanced">
          <summary id="advanced-label"></summary>
          <div class="advanced-body">
            <p class="meta-label" id="launch-directory-label"></p>
            <p class="path" id="launch-directory"></p>
            <p class="meta-label" id="error-label"></p>
            <pre class="technical" id="technical"></pre>
            <div class="advanced-actions">
              <button class="text-button" id="show-log" type="button"></button>
            </div>
          </div>
        </details>
      </section>

      <footer class="footer">
        <button class="text-button" id="quit" type="button"></button>
      </footer>
    </main>

    <script>
      const params = new URLSearchParams(location.search)
      const model = JSON.parse(params.get('state') || '{}')
      document.documentElement.lang = model.locale === 'zh' ? 'zh-CN' : 'en'
      document.documentElement.dataset.theme = params.get('theme') || 'system'
      document.title = model.badge || 'Sherlock'

      const setText = (id, value) => {
        const node = document.getElementById(id)
        if (node) node.textContent = value || ''
      }

      document.getElementById('icon').src = params.get('icon') || 'icon.png'
      setText('brand', model.brand)
      setText('badge', model.badge)
      setText('heading', model.heading)
      setText('summary', model.summary)
      setText('reason-title', model.reasonTitle)
      setText('reason-detail', model.reasonDetail)
      setText('safety-note', model.safetyNote)
      setText('primary', model.primaryLabel)
      setText('advanced-label', model.advancedLabel)
      setText('launch-directory-label', model.launchDirectoryLabel)
      setText('launch-directory', model.launchDirectory || '—')
      setText('error-label', model.errorLabel)
      setText('technical', model.rawError)
      setText('show-log', model.logLabel)
      setText('quit', model.quitLabel)

      const progress = document.getElementById('progress')
      if (model.progress) {
        progress.textContent = model.progress
        progress.classList.add('visible')
      }
      const notice = document.getElementById('notice')
      if (model.notice) {
        notice.textContent = model.notice
        notice.classList.add('visible')
      }

      const pluginList = document.getElementById('plugins')
      if (Array.isArray(model.plugins) && model.plugins.length > 0) {
        pluginList.classList.add('visible')
        for (const plugin of model.plugins) {
          const item = document.createElement('li')
          const mark = document.createElement('span')
          mark.className = 'plugin-mark'
          mark.setAttribute('aria-hidden', 'true')
          mark.textContent = '!'
          const name = document.createElement('span')
          name.className = 'plugin-name'
          name.textContent = String(plugin)
          item.append(mark, name)
          pluginList.appendChild(item)
        }
      }

      const navigate = (action) => {
        if (window.dshRecovery && typeof window.dshRecovery.action === 'function') {
          void window.dshRecovery.action(action)
        } else {
          location.href = `dsh-recovery://${action}`
        }
      }
      const primary = document.getElementById('primary')
      primary.addEventListener('click', () => {
        primary.disabled = true
        primary.textContent = model.primaryBusyLabel
        navigate(model.canUninstall ? 'uninstall' : 'show-log')
      })
      document.getElementById('show-log').addEventListener('click', () => navigate('show-log'))
      document.getElementById('quit').addEventListener('click', () => navigate('quit'))
    </script>
  </body>
</html>
