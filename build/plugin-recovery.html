<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>DSH Desktop</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --canvas: #f7f7f8;
        --surface: #ffffff;
        --surface-soft: #f5f6f7;
        --ink: #18181b;
        --muted: #71717a;
        --faint: #a1a1aa;
        --line: #e4e4e7;
        --line-strong: #d4d4d8;
        --button: #18181b;
        --button-hover: #303034;
        --primary-ink: #ffffff;
        --danger: #c33b38;
        --shadow: 0 12px 34px rgba(24, 24, 27, 0.1);
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: auto;
        padding: 40px 24px;
        color: var(--ink);
        background: var(--canvas);
      }

      button { font: inherit; }
      .shell {
        display: flex;
        flex-direction: column;
        width: min(700px, 100%);
        max-height: calc(100vh - 80px);
        border: 1px solid var(--line);
        border-radius: 20px;
        overflow: hidden;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .header {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px 26px;
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .brand img { width: 28px; height: 28px; border-radius: 8px; }
      .brand-name { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
      }
      .content { min-height: 0; overflow: auto; padding: 30px 32px 22px; }
      .progress, .notice {
        display: none;
        margin: 0 0 18px;
        padding: 11px 13px;
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.55;
      }
      .progress { color: var(--ink); border: 1px solid var(--line); background: var(--surface-soft); }
      .notice { color: var(--danger); background: rgba(195, 59, 56, 0.08); }
      .progress.visible, .notice.visible { display: block; }
      h1 {
        margin: 0;
        max-width: 590px;
        font-size: 21px;
        font-weight: 650;
        line-height: 1.35;
        letter-spacing: -0.025em;
      }
      .summary {
        margin: 8px 0 20px;
        max-width: 610px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      .summary:empty { display: none; }
      .summary:empty + .conflict-card { margin-top: 30px; }

      .conflict-card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface-soft);
      }
      .reason {
        padding: 17px 19px 16px;
      }
      .reason-label {
        margin: 0 0 7px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 680;
      }
      .reason-detail {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }
      .plugins {
        display: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--line);
        list-style: none;
      }
      .plugins.visible { display: block; }
      .plugins li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 11px;
        min-height: 44px;
        padding: 10px 19px;
        border-top: 1px solid var(--line);
      }
      .plugins li:first-child { border-top: 0; }
      .plugin-mark {
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        color: var(--muted);
        background: var(--surface);
        font-size: 12px;
        font-weight: 750;
      }
      .plugin-check-actions { width: 100%; display: flex; justify-content: flex-end; gap: 8px; }
      .plugin-check-actions .plugin-upgrade-btn { margin-left: 0; }
      .plugin-check-actions .plugin-remove-btn { color: var(--text); border-color: var(--line-strong); background: var(--surface); }
      .plugin-check-hint { width: 100%; font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
      .plugin-name {
        min-width: 0;
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
      }

      .safety {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        flex: 0 1 auto;
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .safety-icon {
        width: 17px;
        height: 17px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        margin-top: 1px;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
      }

      .decision-row {
        display: flex;
        align-items: flex-end;
        flex-direction: column;
        gap: 12px;
        margin-top: 22px;
      }
      .actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex: 0 0 auto;
        gap: 9px;
        margin: 0;
      }
      .button {
        min-height: 39px;
        padding: 9px 15px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        color: var(--ink);
        background: var(--surface);
        cursor: pointer;
        font-size: 13px;
        font-weight: 620;
        transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
      }
      .button:hover { background: var(--surface-soft); }
      .button:active { transform: translateY(1px); }
      .button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      .button.primary {
        border-color: var(--button);
        color: var(--primary-ink);
        background: var(--button);
      }
      .button.primary:hover { border-color: var(--button-hover); background: var(--button-hover); }
      .button[disabled] { opacity: 0.64; cursor: wait; transform: none; }

      [hidden] { display: none !important; }

      .plugin-upgrade-btn {
        margin-left: auto;
        padding: 4px 10px;
        border: 1px solid rgba(22, 163, 74, 0.28);
        border-radius: 8px;
        color: #15803d;
        background: rgba(22, 163, 74, 0.08);
        cursor: pointer;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        font-weight: 550;
        line-height: 1.4;
        white-space: nowrap;
        transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
      }
      .plugin-upgrade-btn:hover {
        background: rgba(22, 163, 74, 0.16);
        border-color: rgba(22, 163, 74, 0.4);
      }
      .plugin-upgrade-btn:active {
        transform: translateY(1px);
      }
      .plugin-upgrade-btn:disabled {
        opacity: 0.6;
        cursor: wait;
        transform: none;
      }
      :root[data-theme="dark"] .plugin-upgrade-btn {
        color: #4ade80;
        background: rgba(74, 222, 128, 0.12);
        border-color: rgba(74, 222, 128, 0.25);
      }
      :root[data-theme="dark"] .plugin-upgrade-btn:hover {
        background: rgba(74, 222, 128, 0.2);
        border-color: rgba(74, 222, 128, 0.45);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .plugin-upgrade-btn {
          color: #4ade80;
          background: rgba(74, 222, 128, 0.12);
          border-color: rgba(74, 222, 128, 0.25);
        }
        :root:not([data-theme="light"]) .plugin-upgrade-btn:hover {
          background: rgba(74, 222, 128, 0.2);
          border-color: rgba(74, 222, 128, 0.45);
        }
      }

      .advanced {
        margin-top: 24px;
        border-top: 1px solid var(--line);
      }
      .advanced summary {
        display: inline-flex;
        align-items: center;
        padding: 14px 2px 0;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: 630;
        list-style: none;
      }
      .advanced summary::-webkit-details-marker { display: none; }
      .advanced summary::after {
        width: 6px;
        height: 6px;
        margin-left: 8px;
        border-right: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        content: "";
        transform: rotate(-45deg);
        transform-origin: center;
      }
      .advanced[open] summary::after { transform: rotate(45deg) translateY(-1px); }
      .advanced-body { padding: 13px 0 2px; }
      .meta-label {
        margin: 0 0 6px;
        color: var(--faint);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .path, .technical {
        margin: 0 0 14px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.55;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .advanced-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .text-button {
        min-height: 32px;
        padding: 5px 9px;
        border: 0;
        border-radius: 7px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
      }
      .text-button:hover { color: var(--ink); background: var(--surface-soft); }
      .text-button.danger:hover { color: var(--danger); background: rgba(195, 59, 56, 0.08); }
      .footer {
        display: flex;
        flex-shrink: 0;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-start;
        gap: 16px;
        padding: 11px 26px;
        border-top: 1px solid var(--line);
        color: var(--faint);
        background: var(--surface);
        font-size: 11px;
      }
      .community { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .community-links { display: flex; align-items: center; gap: 6px; }
      .community a, .community button { display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); text-decoration: none; white-space: nowrap; background: transparent; cursor: pointer; font: inherit; }
      .community a:hover, .community button:hover { color: var(--ink); border-color: var(--muted); }
      .community a:focus-visible, .community button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      .community svg { width: 15px; height: 15px; flex-shrink: 0; }
      .community button { background: var(--soft, var(--surface-soft)); }
      .community a { padding-inline: 4px; border-color: transparent; border-radius: 4px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
      .community a:hover { border-color: transparent; text-decoration-color: currentColor; }
      .community .external-icon { width: 12px; height: 12px; }
      .wechat-popover { position: fixed; inset: auto; margin: 0; width: 226px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: var(--surface); box-shadow: 0 8px 28px rgba(0,0,0,.16); font-size: 12px; text-align: center; }
      .wechat-popover img { display: block; width: 200px; height: 200px; background: #fff; border-radius: 6px; }
      .wechat-popover p { margin: 10px 0 0; line-height: 1.5; }
      .footer > #quit { margin-left: auto; flex-shrink: 0; }
      @media (max-width: 620px) {
        body { display: block; padding: 46px 0 0; background: var(--surface); }
        .shell { width: 100%; min-height: calc(100vh - 46px); max-height: none; border: 0; border-radius: 0; box-shadow: none; }
        .header { padding-inline: 20px; }
        .content { padding: 24px 20px 16px; }
        .decision-row { align-items: stretch; }
        .actions { align-items: stretch; flex-direction: column-reverse; }
        .button { width: 100%; }
        .footer { padding-inline: 20px; }
      }

      :root[data-theme="dark"] {
        --canvas: #141416;
        --surface: #202023;
        --surface-soft: #29292d;
        --ink: #f2f2f4;
        --muted: #a5a7ad;
        --faint: #7f8289;
        --line: #3a3a3f;
        --line-strong: #4a4a50;
        --button: #f4f4f5;
        --button-hover: #ffffff;
        --primary-ink: #111217;
        --danger: #ee7772;
        --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --canvas: #141416;
          --surface: #202023;
          --surface-soft: #29292d;
          --ink: #f2f2f4;
          --muted: #a5a7ad;
          --faint: #7f8289;
          --line: #3a3a3f;
          --line-strong: #4a4a50;
          --button: #f4f4f5;
          --button-hover: #ffffff;
          --primary-ink: #111217;
          --danger: #ee7772;
          --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .button { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-labelledby="heading">
      <header class="header">
        <div class="brand">
          <img id="icon" alt="" />
          <span class="brand-name" id="brand"></span>
          <span class="badge" id="badge"></span>
        </div>
      </header>

      <section class="content">
        <p class="progress" id="progress"></p>
        <p class="notice" id="notice" role="alert"></p>
        <h1 id="heading"></h1>
        <p class="summary" id="summary"></p>

        <section class="conflict-card" aria-label="Plugin recovery details">
          <div class="reason">
            <p class="reason-label" id="reason-title"></p>
            <p class="reason-detail" id="reason-detail"></p>
          </div>
          <ul class="plugins" id="plugins"></ul>
        </section>

        <div class="decision-row">
          <div class="actions">
            <button class="button" id="safe-mode" type="button"></button>
            <button class="button" id="secondary" type="button" hidden></button>
            <button class="button primary" id="primary" type="button"></button>
          </div>
          <p class="safety">
            <span class="safety-icon" aria-hidden="true">✓</span>
            <span id="safety-note"></span>
          </p>
        </div>

        <details class="advanced">
          <summary id="advanced-label"></summary>
          <div class="advanced-body">
            <p class="meta-label" id="launch-directory-label"></p>
            <p class="path" id="launch-directory"></p>
            <p class="meta-label" id="error-label"></p>
            <pre class="technical" id="technical"></pre>
            <div class="advanced-actions">
              <button class="text-button" id="show-log" type="button"></button>
            </div>
          </div>
        </details>
      </section>

      <footer class="footer">
        <aside class="community" aria-labelledby="community-label">
          <span id="community-label"></span>
          <span class="community-links">
            <button id="community-wechat" type="button" aria-expanded="false" aria-controls="wechat-popover">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="6" height="6" rx="1" />
                <rect x="15" y="3" width="6" height="6" rx="1" />
                <rect x="3" y="15" width="6" height="6" rx="1" />
                <path d="M15 15h3v3h3v3h-6v-3m6-6v3M3 12h3m6-9v3m0 6v3m0 6v-3" />
              </svg>
              <span id="community-wechat-label"></span>
            </button>
            <a id="community-discord" href="https://discord.gg/he2gAKCpj" target="_blank" rel="noopener noreferrer">
              <span>Discord</span>
              <svg class="external-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 12 12 4M5 4h7v7" />
              </svg>
            </a>
          </span>
        </aside>
        <button class="text-button" id="quit" type="button"></button>
      </footer>
    </main>
    <div id="wechat-popover" class="wechat-popover" popover="auto" role="region" aria-labelledby="wechat-caption">
      <img id="wechat-qr" src="community-wechat-qr.png" width="200" height="200" alt="" />
      <p id="wechat-caption"></p>
    </div>

    <script>
      const params = new URLSearchParams(location.search)
      const model = JSON.parse(params.get('state') || '{}')
      document.documentElement.lang = model.locale === 'zh' ? 'zh-CN' : 'en'
      document.documentElement.dataset.theme = params.get('theme') || 'system'
      document.title = model.badge || 'DSH Desktop'

      const setText = (id, value) => {
        const node = document.getElementById(id)
        if (node) node.textContent = value || ''
      }

      document.getElementById('icon').src = params.get('icon') || 'icon.png'
      setText('brand', model.brand)
      setText('badge', model.badge)
      setText('heading', model.heading)
      setText('summary', model.summary)
      setText('reason-title', model.reasonTitle)
      setText('reason-detail', model.reasonDetail)
      setText('safety-note', model.safetyNote)
      setText('advanced-label', model.advancedLabel)
      setText('launch-directory-label', model.launchDirectoryLabel)
      setText('launch-directory', model.launchDirectory || '—')
      setText('error-label', model.errorLabel)
      setText('technical', model.rawError)
      setText('show-log', model.logLabel)
      setText('quit', model.quitLabel)
      setText('community-label', model.locale === 'zh' ? '遇到问题？来社区交流' : 'Need help? Join our community')
      setText('community-wechat-label', model.locale === 'zh' ? '微信群' : 'WeChat')
      setText('wechat-caption', model.locale === 'zh' ? '扫码加入 DSH 用户群' : 'Scan to join the DSH community')
      const wechat = document.getElementById('community-wechat')
      const wechatPopover = document.getElementById('wechat-popover')
      document.getElementById('wechat-qr').alt = model.locale === 'zh' ? 'DSH 用户群二维码' : 'DSH community WeChat QR code'
      let wechatCloseTimer
      const positionWechat = () => {
        const anchor = wechat.getBoundingClientRect()
        const popup = wechatPopover.getBoundingClientRect()
        const left = Math.max(12, Math.min(anchor.left, innerWidth - popup.width - 12))
        const top = Math.max(12, Math.min(anchor.top - popup.height - 8, innerHeight - popup.height - 12))
        wechatPopover.style.left = `${left}px`
        wechatPopover.style.top = `${top}px`
      }
      const openWechat = () => {
        clearTimeout(wechatCloseTimer)
        if (!wechatPopover.matches(':popover-open')) wechatPopover.showPopover()
        positionWechat()
      }
      const closeWechat = () => {
        clearTimeout(wechatCloseTimer)
        if (wechatPopover.matches(':popover-open')) wechatPopover.hidePopover()
      }
      const scheduleWechatClose = () => {
        clearTimeout(wechatCloseTimer)
        wechatCloseTimer = setTimeout(() => {
          if (!wechat.matches(':hover') && !wechatPopover.matches(':hover') && document.activeElement !== wechat) closeWechat()
        }, 150)
      }
      wechat.addEventListener('pointerenter', openWechat)
      wechat.addEventListener('pointerleave', scheduleWechatClose)
      wechat.addEventListener('focus', openWechat)
      wechat.addEventListener('blur', scheduleWechatClose)
      wechat.addEventListener('click', openWechat)
      wechatPopover.addEventListener('pointerenter', () => clearTimeout(wechatCloseTimer))
      wechatPopover.addEventListener('pointerleave', scheduleWechatClose)
      wechatPopover.addEventListener('toggle', () => wechat.setAttribute('aria-expanded', String(wechatPopover.matches(':popover-open'))))
      window.addEventListener('resize', closeWechat)
      document.addEventListener('scroll', closeWechat, true)
      document.getElementById('community-discord').title = model.locale === 'zh'
        ? '在浏览器中打开 Discord 社区'
        : 'Open our Discord community in your browser'
      const safeModeBtn = document.getElementById('safe-mode')
      if (safeModeBtn) {
        // The primary action already enters Safe Mode when no repair is available.
        safeModeBtn.hidden = !model.canUninstall && !model.upgradeCandidate
        safeModeBtn.textContent = model.safeModeLabel || (model.locale === 'zh' ? '进入安全模式' : 'Enter Safe Mode')
        safeModeBtn.addEventListener('click', () => {
          safeModeBtn.disabled = true
          primary.disabled = true
          if (secondary) secondary.disabled = true
          document.querySelectorAll('.plugin-upgrade-btn').forEach((btn) => { btn.disabled = true })
          safeModeBtn.textContent = model.locale === 'zh' ? '正在进入安全模式…' : 'Entering Safe Mode…'
          navigate('safe-mode')
        })
      }

      const progress = document.getElementById('progress')
      if (model.progress) {
        progress.textContent = model.progress
        progress.classList.add('visible')
      }
      const notice = document.getElementById('notice')
      if (model.notice) {
        notice.textContent = model.notice
        notice.classList.add('visible')
      }

      const pluginList = document.getElementById('plugins')
      if (Array.isArray(model.plugins) && model.plugins.length > 0) {
        pluginList.classList.add('visible')
        for (const [pluginIndex, plugin] of model.plugins.entries()) {
          const item = document.createElement('li')
          const mark = document.createElement('span')
          mark.className = 'plugin-mark'
          mark.setAttribute('aria-hidden', 'true')
          mark.textContent = '!'
          const name = document.createElement('span')
          name.className = 'plugin-name'
          const check = model.pluginChecks?.[pluginIndex]
          name.textContent = check?.packageName || String(plugin)
          item.append(mark, name)

          if (check) {
            const hint = document.createElement('span')
            hint.className = 'plugin-check-hint'
            hint.textContent = check.hint
            item.appendChild(hint)
            const actions = document.createElement('div')
            actions.className = 'plugin-check-actions'
            item.appendChild(actions)
            const addAction = (type, label) => {
              const button = document.createElement('button')
              button.type = 'button'
              button.className = `plugin-upgrade-btn${type === 'uninstall' ? ' plugin-remove-btn' : ''}`
              button.textContent = label
              button.addEventListener('click', () => {
                document.querySelectorAll('button').forEach((control) => { control.disabled = true })
                navigate(`${type}:${check.packageName}`)
              })
              actions.appendChild(button)
            }
            if (check.upgradeCandidate) {
              addAction('upgrade', model.locale === 'zh'
                ? `升级至 v${check.upgradeCandidate.targetVersion}`
                : `Upgrade to v${check.upgradeCandidate.targetVersion}`)
            }
            addAction('uninstall', model.locale === 'zh' ? '卸载此插件' : 'Remove this plugin')
          } else {
          const candidate = model.upgradeCandidate
          const candidateName = candidate
            ? (candidate.packageName.startsWith('@')
                ? candidate.packageName.slice(candidate.packageName.indexOf('/') + 1)
                : candidate.packageName)
            : undefined

          if (candidate && (candidateName === plugin || model.plugins.length === 1)) {
            const upgradeBtn = document.createElement('button')
            upgradeBtn.type = 'button'
            upgradeBtn.className = 'plugin-upgrade-btn plugin-upgrade'
            const versionStr = candidate.targetVersion.startsWith('v')
              ? candidate.targetVersion
              : `v${candidate.targetVersion}`
            upgradeBtn.textContent = model.upgradeHint || (model.locale === 'zh' ? `该插件有新的兼容版本（${versionStr}）` : `A compatible update is available (${versionStr})`)
            upgradeBtn.title = model.locale === 'zh' ? `可升级至 ${versionStr}` : `Can upgrade to ${versionStr}`
            upgradeBtn.addEventListener('click', () => {
              primary.click()
            })
            item.appendChild(upgradeBtn)
          }

          }

          pluginList.appendChild(item)
        }
      }

      const navigate = (action) => {
        if (window.dshRecovery && typeof window.dshRecovery.action === 'function') {
          void window.dshRecovery.action(action)
        } else {
          const target = /^(upgrade|uninstall):(.+)$/.exec(action)
          location.href = target
            ? `dsh-recovery://${target[1]}?plugin=${encodeURIComponent(target[2])}`
            : `dsh-recovery://${action}`
        }
      }
      const primary = document.getElementById('primary')
      const secondary = document.getElementById('secondary')

      if (model.retryCheckLabel) {
        setText('primary', model.retryCheckLabel)
      } else if (model.autoProcessLabel) {
        setText('primary', model.autoProcessLabel)
      } else if (model.upgradeCandidate) {
        setText('primary', model.upgradeLabel)
        setText('secondary', model.uninstallLabel || (model.locale === 'zh' ? '卸载插件' : 'Uninstall plugin'))
        secondary.hidden = false
        secondary.addEventListener('click', () => {
          secondary.disabled = true
          primary.disabled = true
          if (safeModeBtn) safeModeBtn.disabled = true
          document.querySelectorAll('.plugin-upgrade-btn').forEach((btn) => { btn.disabled = true })
          secondary.textContent = model.locale === 'zh' ? '正在卸载…' : 'Removing…'
          navigate('uninstall')
        })
      } else {
        setText('primary', model.primaryLabel)
      }

      primary.addEventListener('click', () => {
        primary.disabled = true
        if (secondary) secondary.disabled = true
        if (safeModeBtn) safeModeBtn.disabled = true
        document.querySelectorAll('.plugin-upgrade-btn').forEach((btn) => { btn.disabled = true })
        if (model.retryCheckLabel) {
          primary.textContent = model.locale === 'zh' ? '正在检查更新…' : 'Checking updates…'
          navigate('check-updates')
        } else if (model.autoProcessLabel) {
          primary.textContent = model.locale === 'zh' ? '正在自动处理…' : 'Recovering plugins…'
          navigate('auto-process')
        } else if (model.upgradeCandidate) {
          primary.textContent = model.upgradeBusyLabel || (model.locale === 'zh' ? '正在升级…' : 'Upgrading…')
          navigate('upgrade')
        } else {
          primary.textContent = model.primaryBusyLabel
          navigate(model.canUninstall ? 'uninstall' : 'safe-mode')
        }
      })
      document.getElementById('show-log').addEventListener('click', () => navigate('show-log'))
      document.getElementById('quit').addEventListener('click', () => navigate('quit'))
    </script>
  </body>
</html>
