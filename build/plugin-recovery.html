<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>DSH Desktop</title>
    <style>
      :root {
        color-scheme: light dark;
        /* Reading column for the recovery content: fixed, not a share of the
           window, so lines stay a readable length on wide displays and the
           column simply collapses to the window on narrow ones. Header and
           footer keep their full-width rules but align to the same column. */
        --page-max: 800px;
        --details-width: 420px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --canvas: #f7f7f8;
        --surface: #ffffff;
        --surface-soft: #f5f6f7;
        --ink: #18181b;
        --muted: #71717a;
        --faint: #a1a1aa;
        --line: #e4e4e7;
        --line-strong: #d4d4d8;
        --button: #18181b;
        --button-hover: #303034;
        --primary-ink: #ffffff;
        --danger: #c33b38;
        --shadow: 0 12px 34px rgba(24, 24, 27, 0.1);
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
      /* The page fills the window; the 46px strip keeps the header clear of the
         hidden title bar's window controls. Header and footer stay put and only
         the content between them scrolls. */
      body {
        height: 100vh;
        display: block;
        overflow: hidden;
        padding: 46px 0 0;
        color: var(--ink);
        background: var(--surface);
      }

      button { font: inherit; }
      .shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: calc(100vh - 46px);
        background: var(--surface);
      }
      .header {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px max(26px, calc((100% - var(--page-max)) / 2));
        transition: padding-left 200ms ease, padding-right 200ms ease;
      }
      /* Both header edges track the left column while the panel is open, so
         the brand and the quit button line up with the content beside them. */
      .shell.details-open .header {
        padding-left: max(20px, calc((100% - var(--details-width) - var(--page-max)) / 2));
        padding-right: calc(var(--details-width) + max(20px, calc((100% - var(--details-width) - var(--page-max)) / 2)));
      }
      .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
      .brand img { width: 28px; height: 28px; border-radius: 8px; }
      .brand-name { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
      .content { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; padding: 30px 32px 22px; }
      /* The content column measures itself, so it stays centered in whatever
         width is left beside the details panel. */
      .column { display: flex; flex: 1 1 auto; flex-direction: column; width: min(100%, var(--page-max)); min-height: 0; margin-inline: auto; }
      .column > * { flex-shrink: 0; }
      /* The plugin card is the only thing that gives way: it shrinks to the
         space left by the heading and the buttons and scrolls inside. */
      .column > .conflict-card { flex: 0 1 auto; min-height: 0; overflow: auto; }
      /* With the details panel open the reading column keeps its 800px cap
         and stays centered, but the gutter shrinks to 20px so the narrower
         left column gives as much of its width to the content as it can. */
      .body-row.details-open .content { padding-inline: 20px; }
      .notice {
        display: none;
        margin: 0 0 18px;
        padding: 11px 13px;
        border-radius: 10px;
        color: var(--danger);
        background: rgba(195, 59, 56, 0.08);
        font-size: 12px;
        line-height: 1.55;
      }
      .notice.visible { display: block; }
      /* Recovery progress sits under the heading as a caption and a thin bar:
         handled plugins over handled plus still-failing ones. */
      .progress {
        display: none;
        flex-direction: column;
        gap: 8px;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .progress.visible { display: flex; }
      .progress-track {
        display: block;
        height: 4px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }
      .progress-fill {
        display: block;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: var(--ink);
        transition: width 240ms ease;
      }
      h1 {
        margin: 0;
        max-width: 590px;
        font-size: 21px;
        font-weight: 650;
        line-height: 1.35;
        letter-spacing: -0.025em;
      }
      .summary {
        margin: 8px 0 20px;
        max-width: 610px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      .summary:empty { display: none; }
      .summary:empty + .conflict-card { margin-top: 30px; }

      .conflict-card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface-soft);
      }
      .reason {
        padding: 17px 19px 16px;
      }
      .reason-label {
        margin: 0 0 7px;
        color: var(--ink);
        font-size: 13px;
        font-weight: 680;
      }
      .reason-detail {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }
      .plugins {
        display: none;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .plugins.visible { display: block; }
      .plugins li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 11px;
        min-height: 44px;
        padding: 10px 19px;
        border-top: 1px solid var(--line);
      }
      .plugins li:first-child { border-top: 0; }
      .plugin-mark {
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        color: var(--muted);
        background: var(--surface);
        font-size: 12px;
        font-weight: 750;
      }
      .plugin-check-actions { width: 100%; display: flex; justify-content: flex-end; gap: 8px; }
      .plugin-check-actions .plugin-upgrade-btn { margin-left: 0; }
      .plugin-check-hint { width: 100%; font-size: 12px; line-height: 1.6; overflow-wrap: anywhere; }
      .plugin-name {
        min-width: 0;
        overflow-wrap: anywhere;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
      }

      .safety {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        flex: 0 1 auto;
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .safety-icon {
        width: 17px;
        height: 17px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        margin-top: 1px;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
      }

      .decision-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-top: 22px;
      }
      .decision-aside { display: flex; flex: 0 0 auto; }
      .decision-main {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 12px;
        min-width: 0;
      }
      .decision-row.safe-mode-only { justify-content: center; }
      .decision-row.safe-mode-only .decision-aside { display: none; }
      .decision-row.safe-mode-only .decision-main {
        flex-direction: row-reverse;
        align-items: center;
        gap: 16px;
      }
      .actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex: 0 0 auto;
        gap: 9px;
        margin: 0;
      }
      .button {
        min-height: 39px;
        padding: 9px 15px;
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        color: var(--ink);
        background: var(--surface);
        cursor: pointer;
        font-size: 13px;
        font-weight: 620;
        transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
      }
      .button:hover { background: var(--surface-soft); }
      .button:active { transform: translateY(1px); }
      .button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      .button.primary {
        border-color: var(--button);
        color: var(--primary-ink);
        background: var(--button);
      }
      .button.primary:hover { border-color: var(--button-hover); background: var(--button-hover); }
      .button[disabled] { opacity: 0.64; cursor: wait; transform: none; }

      [hidden] { display: none !important; }

      .plugin-upgrade-btn {
        margin-left: auto;
        padding: 4px 10px;
        border: 1px solid rgba(22, 163, 74, 0.28);
        border-radius: 8px;
        color: #15803d;
        background: rgba(22, 163, 74, 0.08);
        cursor: pointer;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        font-weight: 550;
        line-height: 1.4;
        white-space: nowrap;
        transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
      }
      .plugin-upgrade-btn:hover {
        background: rgba(22, 163, 74, 0.16);
        border-color: rgba(22, 163, 74, 0.4);
      }
      .plugin-upgrade-btn:active {
        transform: translateY(1px);
      }
      .plugin-upgrade-btn:disabled {
        opacity: 0.6;
        cursor: wait;
        transform: none;
      }
      :root[data-theme="dark"] .plugin-upgrade-btn {
        color: #4ade80;
        background: rgba(74, 222, 128, 0.12);
        border-color: rgba(74, 222, 128, 0.25);
      }
      :root[data-theme="dark"] .plugin-upgrade-btn:hover {
        background: rgba(74, 222, 128, 0.2);
        border-color: rgba(74, 222, 128, 0.45);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .plugin-upgrade-btn {
          color: #4ade80;
          background: rgba(74, 222, 128, 0.12);
          border-color: rgba(74, 222, 128, 0.25);
        }
        :root:not([data-theme="light"]) .plugin-upgrade-btn:hover {
          background: rgba(74, 222, 128, 0.2);
          border-color: rgba(74, 222, 128, 0.45);
        }
      }
      /* Removal is the neutral choice on a plugin row: it takes the same
         colors as the secondary buttons below, in light and dark alike. */
      .plugin-upgrade-btn.plugin-remove-btn,
      :root[data-theme="dark"] .plugin-upgrade-btn.plugin-remove-btn,
      :root:not([data-theme="light"]) .plugin-upgrade-btn.plugin-remove-btn {
        color: var(--ink);
        border-color: var(--line-strong);
        background: var(--surface);
      }
      .plugin-upgrade-btn.plugin-remove-btn:hover,
      :root[data-theme="dark"] .plugin-upgrade-btn.plugin-remove-btn:hover,
      :root:not([data-theme="light"]) .plugin-upgrade-btn.plugin-remove-btn:hover {
        border-color: var(--line-strong);
        background: var(--surface-soft);
      }

      .heading-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }
      .details-toggle {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        margin-top: 4px;
      }
      .details-toggle::after {
        width: 6px;
        height: 6px;
        margin-left: 8px;
        border-right: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        content: "";
        transform: rotate(-45deg);
        transform-origin: center;
      }

      /* Technical details open as a second column beside the content, between
         header and footer. Closed, the column has no width; open, it takes a
         fixed width and the content column shrinks to fit. */
      .body-row {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
      }
      .details-panel {
        display: flex;
        flex: 0 0 0px;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
        background: var(--surface);
        visibility: hidden;
        transition: flex-basis 200ms ease, visibility 0s linear 200ms;
      }
      .details-panel.open {
        flex-basis: var(--details-width);
        visibility: visible;
        transition: flex-basis 200ms ease;
      }
      /* Drag handle between the columns: a 24px hit area straddling the whole
         seam; while hovered or dragged it shows a short line that fades at
         both ends and follows the pointer's vertical position. */
      .details-resizer {
        position: relative;
        z-index: 2;
        flex: 0 0 0px;
        width: 0;
        cursor: col-resize;
        outline: none;
      }
      .details-resizer::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: -12px;
        width: 24px;
      }
      .details-resizer::after {
        content: "";
        position: absolute;
        top: var(--handle-y, 50%);
        left: -1px;
        width: 2px;
        height: 72px;
        border-radius: 1px;
        transform: translateY(-50%);
        background: linear-gradient(to bottom, transparent, var(--line-strong) 30%, var(--line-strong) 70%, transparent);
        opacity: 0;
        transition: opacity 120ms ease;
      }
      .details-resizer:hover::after,
      .details-resizer:focus-visible::after,
      .body-row.resizing .details-resizer::after { opacity: 1; }
      .body-row.resizing { cursor: col-resize; user-select: none; }
      .body-row.resizing .details-panel,
      .shell.resizing .header { transition: none; }
      .details-header {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-width: var(--details-width);
        padding: 30px 20px 12px;
      }
      /* Same type as the page heading, and the same 30px top offset, so the
         two titles sit on one line when the panel is open. */
      .details-header h2 {
        margin: 0;
        font-size: 21px;
        font-weight: 650;
        line-height: 1.35;
        letter-spacing: -0.025em;
      }
      .details-close {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 8px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
      }
      .details-close svg { width: 14px; height: 14px; }
      .details-close:hover { color: var(--ink); background: var(--surface-soft); }
      .details-close:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      .details-card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface-soft);
        padding: 17px 19px 6px;
        margin-bottom: 14px;
      }
      /* 26px under the panel header puts the details card's top edge level
         with the plugin card's (30px under the heading row) when no progress
         bar sits between the heading and the plugins. */
      .details-body {
        flex: 1 1 auto;
        min-width: var(--details-width);
        min-height: 0;
        overflow: auto;
        padding: 26px 20px 22px;
      }
      .meta-label {
        margin: 0 0 6px;
        color: var(--faint);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .path, .technical {
        margin: 0 0 14px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.55;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .advanced-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .advanced-actions .plugin-upgrade-btn { margin-left: 0; }
      .text-button {
        min-height: 32px;
        padding: 5px 9px;
        border: 0;
        border-radius: 7px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
      }
      .text-button:hover { color: var(--ink); background: var(--surface-soft); }
      .text-button.danger:hover { color: var(--danger); background: rgba(195, 59, 56, 0.08); }
      .footer {
        display: flex;
        flex-shrink: 0;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 11px max(26px, calc((100% - var(--page-max)) / 2));
        color: var(--faint);
        background: var(--surface);
        font-size: 11px;
      }
      .community { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .community-links { display: flex; align-items: center; gap: 6px; }
      .community a, .community button { display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); text-decoration: none; white-space: nowrap; background: transparent; cursor: pointer; font: inherit; }
      .community a:hover, .community button:hover { color: var(--ink); border-color: var(--muted); }
      .community a:focus-visible, .community button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      .community svg { width: 15px; height: 15px; flex-shrink: 0; }
      .community .brand-icon { width: 14px; height: 14px; }
      .community button { border-color: transparent; }
      .community button:hover { background: var(--soft, var(--surface-soft)); border-color: var(--line); }
      .community a { padding-inline: 4px; border-color: transparent; border-radius: 4px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
      .community a:hover { border-color: transparent; text-decoration-color: currentColor; }
      .community .external-icon { width: 12px; height: 12px; }
      .wechat-popover { position: fixed; inset: auto; margin: 0; width: 226px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: var(--surface); box-shadow: 0 8px 28px rgba(0,0,0,.16); font-size: 12px; text-align: center; }
      .wechat-popover img { display: block; width: 200px; height: 200px; background: #fff; border-radius: 6px; }
      .wechat-popover p { margin: 10px 0 0; line-height: 1.5; }
      .header > #quit { margin-left: auto; flex-shrink: 0; }
      @media (max-width: 620px) {
        .header, .shell.details-open .header { padding-inline: 20px; }
        .content { padding: 24px 20px 16px; }
        .heading-row { flex-direction: column; align-items: flex-start; gap: 6px; }
        .body-row { flex-direction: column; }
        .details-resizer { display: none !important; }
        .details-panel { flex-basis: 0; }
        .details-panel.open { flex-basis: auto; }
        .details-header, .details-body { min-width: 0; }
        .decision-row { flex-direction: column; align-items: stretch; }
        .decision-row.safe-mode-only .decision-main { flex-direction: column-reverse; align-items: stretch; }
        .decision-aside, .decision-main { align-items: stretch; }
        .actions { align-items: stretch; flex-direction: column-reverse; }
        .button { width: 100%; }
        .footer { padding-inline: 20px; }
      }

      :root[data-theme="dark"] {
        --canvas: #141416;
        --surface: #202023;
        --surface-soft: #29292d;
        --ink: #f2f2f4;
        --muted: #a5a7ad;
        --faint: #7f8289;
        --line: #3a3a3f;
        --line-strong: #4a4a50;
        --button: #f4f4f5;
        --button-hover: #ffffff;
        --primary-ink: #111217;
        --danger: #ee7772;
        --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --canvas: #141416;
          --surface: #202023;
          --surface-soft: #29292d;
          --ink: #f2f2f4;
          --muted: #a5a7ad;
          --faint: #7f8289;
          --line: #3a3a3f;
          --line-strong: #4a4a50;
          --button: #f4f4f5;
          --button-hover: #ffffff;
          --primary-ink: #111217;
          --danger: #ee7772;
          --shadow: 0 18px 48px rgba(0, 0, 0, 0.3);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .button { transition: none; }
        .details-panel, .header { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-labelledby="heading">
      <header class="header">
        <div class="brand">
          <img id="icon" alt="" />
          <span class="brand-name" id="brand"></span>
        </div>
        <button class="text-button" id="quit" type="button"></button>
      </header>

      <div class="body-row" id="body-row">
      <section class="content">
       <div class="column">
        <p class="notice" id="notice" role="alert"></p>
        <div class="heading-row">
          <h1 id="heading"></h1>
          <button class="text-button details-toggle" id="advanced-label" type="button"
            aria-haspopup="dialog" aria-controls="details-drawer" aria-expanded="false"></button>
        </div>
        <div class="progress" id="progress">
          <span class="progress-text" id="progress-text"></span>
          <span class="progress-track" role="progressbar" id="progress-bar" aria-labelledby="progress-text" aria-valuemin="0" aria-valuemax="100">
            <span class="progress-fill" id="progress-fill"></span>
          </span>
        </div>
        <p class="summary" id="summary"></p>

        <section class="conflict-card" id="conflict-card" aria-label="Plugin recovery details">
          <ul class="plugins" id="plugins"></ul>
        </section>

        <div class="decision-row" id="decision-row">
          <div class="decision-aside">
            <button class="button" id="safe-mode" type="button"></button>
          </div>
          <div class="decision-main">
            <div class="actions">
              <button class="button" id="repair-agent" type="button" hidden></button>
              <button class="button" id="secondary" type="button" hidden></button>
              <button class="button primary" id="primary" type="button"></button>
            </div>
            <p class="safety">
              <span class="safety-icon" aria-hidden="true">✓</span>
              <span id="safety-note"></span>
            </p>
          </div>
        </div>

       </div>
      </section>
      <div class="details-resizer" id="details-resizer" role="separator" aria-orientation="vertical"
        aria-controls="details-drawer" tabindex="-1" hidden></div>
      <aside class="details-panel" id="details-drawer" role="region" aria-labelledby="drawer-title" aria-hidden="true">
        <header class="details-header">
          <h2 id="drawer-title"></h2>
          <button class="details-close" id="details-close" type="button">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8" />
            </svg>
          </button>
        </header>
        <div class="details-body">
          <div class="details-card">
            <p class="meta-label" id="launch-directory-label"></p>
            <p class="path" id="launch-directory"></p>
            <p class="meta-label" id="error-label"></p>
            <pre class="technical" id="technical"></pre>

      <footer class="footer">
        <aside class="community" aria-labelledby="community-label">
          <span id="community-label"></span>
          <span class="community-links">
            <button id="community-wechat" type="button" aria-expanded="false" aria-controls="wechat-popover">
              <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z" />

    </main>
    <div id="wechat-popover" class="wechat-popover" popover="auto" role="region" aria-labelledby="wechat-caption">
      <img id="wechat-qr" src="community-wechat-qr.png" width="200" height="200" alt="" />
      <p id="wechat-caption"></p>
    </div>

    <script>
      const params = new URLSearchParams(location.search)
      const model = JSON.parse(params.get('state') || '{}')
      document.documentElement.lang = model.locale === 'zh' ? 'zh-CN' : 'en'
      document.documentElement.dataset.theme = params.get('theme') || 'system'
      document.title = model.badge || 'DSH Desktop'

      const setText = (id, value) => {
        const node = document.getElementById(id)
        if (node) node.textContent = value || ''
      }

      document.getElementById('icon').src = params.get('icon') || 'icon.png'
      setText('brand', model.brand)
      setText('heading', model.heading)
      setText('summary', model.summary)
      setText('safety-note', model.safetyNote)
      setText('advanced-label', model.advancedLabel)
      setText('drawer-title', model.locale === 'zh' ? '技术详情' : 'Technical details')
      const detailsDrawer = document.getElementById('details-drawer')
      const detailsToggle = document.getElementById('advanced-label')
      const detailsClose = document.getElementById('details-close')
      detailsClose.setAttribute('aria-label', model.locale === 'zh' ? '关闭技术详情' : 'Close technical details')
      let detailsReturnFocus = null
      const setDetailsOpen = (open) => {
        detailsDrawer.classList.toggle('open', open)
        document.getElementById('body-row').classList.toggle('details-open', open)
        detailsResizer.hidden = !open
        detailsResizer.tabIndex = open ? 0 : -1
        if (open) detailsResizer.setAttribute('aria-valuemax', String(clampDetailsWidth(Infinity)))
        document.querySelector('.shell').classList.toggle('details-open', open)
        detailsDrawer.setAttribute('aria-hidden', String(!open))
        detailsToggle.setAttribute('aria-expanded', String(open))
        if (open) {
          detailsReturnFocus = document.activeElement
          detailsClose.focus()
        } else if (detailsReturnFocus && typeof detailsReturnFocus.focus === 'function') {
          detailsReturnFocus.focus()
        }
      }
      const detailsResizer = document.getElementById('details-resizer')
      const bodyRow = document.getElementById('body-row')
      const shell = document.querySelector('.shell')
      const DETAILS_MIN = 320
      const DETAILS_CONTENT_MIN = 420
      const DETAILS_WIDTH_KEY = 'dsh-recovery-details-width'
      const clampDetailsWidth = (width) => {
        const max = Math.max(DETAILS_MIN, bodyRow.clientWidth - DETAILS_CONTENT_MIN)
        return Math.min(max, Math.max(DETAILS_MIN, Math.round(width)))
      }
      const currentDetailsWidth = () => parseFloat(getComputedStyle(shell).getPropertyValue('--details-width')) || 420
      const applyDetailsWidth = (width) => {
        const next = clampDetailsWidth(width)
        shell.style.setProperty('--details-width', `${next}px`)
        detailsResizer.setAttribute('aria-valuenow', String(next))
        return next
      }
      try {
        const saved = Number(localStorage.getItem(DETAILS_WIDTH_KEY))
        if (saved > 0) applyDetailsWidth(saved)
      } catch {
        // Storage can be unavailable; the default width is fine.
      }
      const rememberDetailsWidth = (width) => {
        try { localStorage.setItem(DETAILS_WIDTH_KEY, String(width)) } catch { /* ignore */ }
      }
      const HANDLE_HALF = 36
      const followPointer = (event) => {
        const bounds = detailsResizer.getBoundingClientRect()
        const y = Math.min(bounds.height - HANDLE_HALF, Math.max(HANDLE_HALF, event.clientY - bounds.top))
        detailsResizer.style.setProperty('--handle-y', `${Math.round(y)}px`)
      }
      detailsResizer.addEventListener('pointerenter', followPointer)
      detailsResizer.addEventListener('pointermove', followPointer)
      detailsResizer.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return
        event.preventDefault()
        const startX = event.clientX
        const startWidth = currentDetailsWidth()
        let width = startWidth
        bodyRow.classList.add('resizing')
        shell.classList.add('resizing')
        detailsResizer.setPointerCapture(event.pointerId)
        const move = (moveEvent) => { width = applyDetailsWidth(startWidth + (startX - moveEvent.clientX)) }
        const stop = () => {
          detailsResizer.removeEventListener('pointermove', move)
          detailsResizer.removeEventListener('pointerup', stop)
          detailsResizer.removeEventListener('pointercancel', stop)
          bodyRow.classList.remove('resizing')
          shell.classList.remove('resizing')
          rememberDetailsWidth(width)
        }
        detailsResizer.addEventListener('pointermove', move)
        detailsResizer.addEventListener('pointerup', stop)
        detailsResizer.addEventListener('pointercancel', stop)
      })
      detailsResizer.addEventListener('keydown', (event) => {
        const step = event.shiftKey ? 64 : 16
        if (event.key === 'ArrowLeft') rememberDetailsWidth(applyDetailsWidth(currentDetailsWidth() + step))
        else if (event.key === 'ArrowRight') rememberDetailsWidth(applyDetailsWidth(currentDetailsWidth() - step))
        else return
        event.preventDefault()
      })
      detailsResizer.setAttribute('aria-valuemin', String(DETAILS_MIN))
      detailsResizer.setAttribute('aria-label', model.locale === 'zh' ? '调整技术详情面板宽度' : 'Resize the technical details panel')
      detailsToggle.addEventListener('click', () => setDetailsOpen(!detailsDrawer.classList.contains('open')))
      detailsClose.addEventListener('click', () => setDetailsOpen(false))
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && detailsDrawer.classList.contains('open')) setDetailsOpen(false)
      })
      setText('launch-directory-label', model.launchDirectoryLabel)
      setText('launch-directory', model.launchDirectory || '—')
      setText('error-label', model.errorLabel)
      setText('technical', model.rawError)
      setText('show-log', model.logLabel)
      setText('quit', model.quitLabel)
      setText('community-label', model.locale === 'zh' ? '遇到问题？来社区交流' : 'Need help? Join our community')
      setText('community-wechat-label', model.locale === 'zh' ? '微信群' : 'WeChat')
      setText('wechat-caption', model.locale === 'zh' ? '扫码加入 DSH 用户群' : 'Scan to join the DSH community')
      const wechat = document.getElementById('community-wechat')
      const wechatPopover = document.getElementById('wechat-popover')
      document.getElementById('wechat-qr').alt = model.locale === 'zh' ? 'DSH 用户群二维码' : 'DSH community WeChat QR code'
      let wechatCloseTimer
      const positionWechat = () => {
        const anchor = wechat.getBoundingClientRect()
        const popup = wechatPopover.getBoundingClientRect()
        const centered = anchor.left + anchor.width / 2 - popup.width / 2
        const left = Math.max(12, Math.min(centered, innerWidth - popup.width - 12))
        const top = Math.max(12, Math.min(anchor.top - popup.height - 8, innerHeight - popup.height - 12))
        wechatPopover.style.left = `${left}px`
        wechatPopover.style.top = `${top}px`
      }
      const openWechat = () => {
        clearTimeout(wechatCloseTimer)
        if (!wechatPopover.matches(':popover-open')) wechatPopover.showPopover()
        positionWechat()
      }
      const closeWechat = () => {
        clearTimeout(wechatCloseTimer)
        if (wechatPopover.matches(':popover-open')) wechatPopover.hidePopover()
      }
      const scheduleWechatClose = () => {
        clearTimeout(wechatCloseTimer)
        wechatCloseTimer = setTimeout(() => {
          if (!wechat.matches(':hover') && !wechatPopover.matches(':hover') && document.activeElement !== wechat) closeWechat()
        }, 150)
      }
      wechat.addEventListener('pointerenter', openWechat)
      wechat.addEventListener('pointerleave', scheduleWechatClose)
      wechat.addEventListener('focus', openWechat)
      wechat.addEventListener('blur', scheduleWechatClose)
      wechat.addEventListener('click', openWechat)
      wechatPopover.addEventListener('pointerenter', () => clearTimeout(wechatCloseTimer))
      wechatPopover.addEventListener('pointerleave', scheduleWechatClose)
      wechatPopover.addEventListener('toggle', () => wechat.setAttribute('aria-expanded', String(wechatPopover.matches(':popover-open'))))
      window.addEventListener('resize', closeWechat)
      document.addEventListener('scroll', closeWechat, true)
      document.getElementById('community-discord').title = model.locale === 'zh'
        ? '在浏览器中打开 Discord 社区'
        : 'Open our Discord community in your browser'
      // No plugin to repair: the primary action itself enters Safe Mode, so the
      // row collapses to that button and its note, centered together.
      const safeModeOnly = model.safeModeOnly ?? (!model.canUninstall && !model.upgradeCandidate && !model.marketPrimary)
      document.getElementById('decision-row').classList.toggle('safe-mode-only', safeModeOnly)
      const safeModeBtn = document.getElementById('safe-mode')
      if (safeModeBtn) {
        // The primary action already enters Safe Mode when no repair is available.
        safeModeBtn.hidden = safeModeOnly
        safeModeBtn.textContent = model.safeModeLabel || (model.locale === 'zh' ? '进入安全模式' : 'Enter Safe Mode')
        safeModeBtn.addEventListener('click', () => {
          safeModeBtn.disabled = true
          primary.disabled = true
          if (secondary) secondary.disabled = true
          document.querySelectorAll('.plugin-upgrade-btn').forEach((btn) => { btn.disabled = true })
          safeModeBtn.textContent = model.locale === 'zh' ? '正在进入安全模式…' : 'Entering Safe Mode…'
          navigate('safe-mode')
        })
      }

      const progress = document.getElementById('progress')
      if (model.progress) {
        const handled = Array.isArray(model.removedPlugins) ? model.removedPlugins.length : 0
        const remaining = Array.isArray(model.plugins) ? model.plugins.length : 0
        const percent = Math.round((handled / Math.max(1, handled + remaining)) * 100)
        setText('progress-text', model.progress)
        document.getElementById('progress-fill').style.width = `${percent}%`
        document.getElementById('progress-bar').setAttribute('aria-valuenow', String(percent))
        progress.classList.add('visible')
      }
      const notice = document.getElementById('notice')
      if (model.notice) {
        notice.textContent = model.notice
        notice.classList.add('visible')
      }

      const conflictCard = document.getElementById('conflict-card')
      const pluginList = document.getElementById('plugins')
      if (Array.isArray(model.plugins) && model.plugins.length > 0) {
        pluginList.classList.add('visible')
        for (const [pluginIndex, plugin] of model.plugins.entries()) {
          const item = document.createElement('li')
          const mark = document.createElement('span')
          mark.className = 'plugin-mark'
          mark.setAttribute('aria-hidden', 'true')
          mark.textContent = '!'
          const name = document.createElement('span')
          name.className = 'plugin-name'
          const check = model.pluginChecks?.[pluginIndex]
          name.textContent = check?.packageName || String(plugin)
          item.append(mark, name)

          if (check) {
            const hint = document.createElement('span')
            hint.className = 'plugin-check-hint'
            hint.textContent = check.hint
            item.appendChild(hint)
            const actions = document.createElement('div')
            actions.className = 'plugin-check-actions'
            item.appendChild(actions)
            const addAction = (type, label) => {
              const button = document.createElement('button')
              button.type = 'button'
              button.className = `plugin-upgrade-btn${type === 'uninstall' ? ' plugin-remove-btn' : ''}`
              button.textContent = label
              button.addEventListener('click', () => {
                document.querySelectorAll('button').forEach((control) => { control.disabled = true })
                navigate(`${type}:${check.packageName}`)
              })
              actions.appendChild(button)
            }
            if (check.upgradeCandidate) {
              addAction('upgrade', model.locale === 'zh'
                ? `升级至 v${check.upgradeCandidate.targetVersion}`
                : `Upgrade to v${check.upgradeCandidate.targetVersion}`)
            }
            addAction('uninstall', model.locale === 'zh' ? '卸载此插件' : 'Remove this plugin')
          } else {
          const candidate = model.upgradeCandidate
          const candidateName = candidate
            ? (candidate.packageName.startsWith('@')
                ? candidate.packageName.slice(candidate.packageName.indexOf('/') + 1)
                : candidate.packageName)
            : undefined

          if (candidate && (candidateName === plugin || model.plugins.length === 1)) {
            const upgradeBtn = document.createElement('button')
            upgradeBtn.type = 'button'
            upgradeBtn.className = 'plugin-upgrade-btn plugin-upgrade'
            const versionStr = candidate.targetVersion.startsWith('v')
              ? candidate.targetVersion
              : `v${candidate.targetVersion}`
            upgradeBtn.textContent = model.upgradeHint || (model.locale === 'zh' ? `该插件有新的兼容版本（${versionStr}）` : `A compatible update is available (${versionStr})`)
            upgradeBtn.title = model.locale === 'zh' ? `可升级至 ${versionStr}` : `Can upgrade to ${versionStr}`
            upgradeBtn.addEventListener('click', () => {
              primary.click()
            })
            item.appendChild(upgradeBtn)
          }

          }

          pluginList.appendChild(item)
        }
      }

      // The market is a core bundle with its own repair, never the plugin
      // removal path; every action here names no version — main picks it.
      const market = model.marketCheck
      if (market) {
        pluginList.classList.add('visible')
        const item = document.createElement('li')
        const mark = document.createElement('span')
        mark.className = 'plugin-mark'
        mark.setAttribute('aria-hidden', 'true')
        mark.textContent = '!'
        const name = document.createElement('span')
        name.className = 'plugin-name'
        name.textContent = String(market.name)
        const hint = document.createElement('span')
        hint.className = 'plugin-check-hint'
        hint.textContent = String(market.hint || '')
        const actions = document.createElement('div')
        actions.className = 'plugin-check-actions'
        // Same row, buttons, and styles as a third-party plugin's check above.
        const addMarketAction = (action, label, className) => {
          if (!label) return
          const button = document.createElement('button')
          button.type = 'button'
          button.className = className
          button.textContent = String(label)
          button.addEventListener('click', () => {
            document.querySelectorAll('button').forEach((control) => { control.disabled = true })
            navigate(action)
          })
          actions.appendChild(button)
        }
        addMarketAction('market-upgrade', market.upgradeLabel, 'plugin-upgrade-btn')
        addMarketAction('market-remove', market.removeLabel, 'plugin-upgrade-btn plugin-remove-btn')
        item.append(mark, name, hint, actions)
        pluginList.appendChild(item)
      }

      // Nothing listed (Safe Mode is the only option): no empty card.
      conflictCard.hidden = !pluginList.classList.contains('visible')
      const navigate = (action) => {
        if (window.dshRecovery && typeof window.dshRecovery.action === 'function') {
          void window.dshRecovery.action(action)
        } else {
          const target = /^(upgrade|uninstall):(.+)$/.exec(action)
          location.href = target
            ? `dsh-recovery://${target[1]}?plugin=${encodeURIComponent(target[2])}`
            : `dsh-recovery://${action}`
        }
      }
      const primary = document.getElementById('primary')
      const secondary = document.getElementById('secondary')

      if (model.retryCheckLabel) {
        setText('primary', model.retryCheckLabel)
      } else if (model.autoProcessLabel) {
        setText('primary', model.autoProcessLabel)
      } else if (model.marketPrimary) {
        // Same buttons as a lone third-party plugin: upgrade first, removal beside it.
        setText('primary', model.primaryLabel)
        if (model.marketCheck.upgradeLabel) {
          setText('secondary', model.locale === 'zh' ? '卸载插件' : 'Uninstall plugin')
          secondary.hidden = false
          secondary.addEventListener('click', () => {
            secondary.disabled = true
            primary.disabled = true
            if (safeModeBtn) safeModeBtn.disabled = true
            document.querySelectorAll('.plugin-upgrade-btn').forEach((btn) => { btn.disabled = true })
            secondary.textContent = model.locale === 'zh' ? '正在卸载…' : 'Removing…'
            navigate('market-remove')
          })
        }
      } else if (model.upgradeCandidate) {
        setText('primary', model.upgradeLabel)
        setText('secondary', model.uninstallLabel || (model.locale === 'zh' ? '卸载插件' : 'Uninstall plugin'))
        secondary.hidden = false
        secondary.addEventListener('click', () => {
          secondary.disabled = true
          primary.disabled = true
          if (safeModeBtn) safeModeBtn.disabled = true
          document.querySelectorAll('.plugin-upgrade-btn').forEach((btn) => { btn.disabled = true })
          secondary.textContent = model.locale === 'zh' ? '正在卸载…' : 'Removing…'
          navigate('uninstall')
        })
      } else {
        setText('primary', model.primaryLabel)
      }

      primary.addEventListener('click', () => {
        primary.disabled = true
        if (secondary) secondary.disabled = true
        if (safeModeBtn) safeModeBtn.disabled = true
        document.querySelectorAll('.plugin-upgrade-btn').forEach((btn) => { btn.disabled = true })
        if (model.retryCheckLabel) {
          primary.textContent = model.locale === 'zh' ? '正在检查更新…' : 'Checking updates…'
          navigate('check-updates')
        } else if (model.autoProcessLabel) {
          primary.textContent = model.locale === 'zh' ? '正在自动处理…' : 'Recovering plugins…'
          navigate('auto-process')
        } else if (model.marketPrimary) {
          primary.textContent = model.primaryBusyLabel
          navigate(model.marketCheck.upgradeLabel ? 'market-upgrade' : 'market-remove')
        } else if (model.upgradeCandidate) {
          primary.textContent = model.upgradeBusyLabel || (model.locale === 'zh' ? '正在升级…' : 'Upgrading…')
          navigate('upgrade')
        } else {
          primary.textContent = model.primaryBusyLabel
          navigate(model.canUninstall ? 'uninstall' : 'safe-mode')
        }
      })
      document.getElementById('show-log').addEventListener('click', () => navigate('show-log'))
      document.getElementById('quit').addEventListener('click', () => navigate('quit'))
    </script>
    <script>
      // Only the request is sent: the main process prepends the offline
      // diagnosis and the failed launch's logs to the first turn.
      const repairAgentPrompt = model.locale === 'zh'
        ? '请结合诊断事实和 harness.log，定位导致启动失败的确切根因。先说明结论和建议的最小可逆操作，在我明确确认之前不要修改任何文件或配置。'
        : 'Using the diagnostic facts and harness.log, find the exact root cause of the startup failure. Explain the conclusion and the smallest reversible fix first, and do not change any file or setting until I explicitly confirm.'
      // Beside the Safe Mode button, and only when no culprit was identified:
      // a named plugin or market has its own repair above.
      const repairAgent = document.getElementById('repair-agent')
      repairAgent.hidden = (model.plugins?.length ?? 0) > 0 || Boolean(model.marketCheck)
      repairAgent.textContent = model.locale === 'zh' ? '智能修复 Agent' : 'Repair agent'
      repairAgent.addEventListener('click', () => {
        document.querySelectorAll('button').forEach((control) => { control.disabled = true })
        void window.dshRecovery.action('agent', { prompt: repairAgentPrompt })
      })
    </script>
  </body>
